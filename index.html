function onConnClickIdx(i){
  const conn=S.connections[i];if(!conn)return;
  S.actionConnIdx=i;
  const a=fullName(S.people[conn.from]),b=fullName(S.people[conn.to]);
  document.getElementById('cam-title').textContent=t('modifyLink');
  document.getElementById('cam-sub').textContent=a+' ↔ '+b;
  const sel=document.getElementById('cam-type');
  sel.value=conn.type==='hijo'?'padre':conn.type;
  const reorderWrap=document.getElementById('cam-reorder-wrap');
  reorderWrap.innerHTML='';reorderWrap.style.display='none';S._reorderPersonId=null;
  if(conn.type==='pareja'){
    const pA=S.connections.filter(c=>c.type==='pareja'&&(c.from===conn.from||c.to===conn.from));
    const pB=S.connections.filter(c=>c.type==='pareja'&&(c.from===conn.to||c.to===conn.to));
    let personId=conn.from,pConns=pA;
    if(pB.length>pA.length){personId=conn.to;pConns=pB;}
    S._reorderPersonId=personId;
    if(pConns.length>1){
      const currentIdx=pConns.indexOf(conn);let opts='';
      for(let pi=0;pi<pConns.length;pi++){const l2=pi===0?t('relPareja'):t('relPareja')+' '+(pi+1);opts+='<option value="'+pi+'"'+(pi===currentIdx?' selected':'')+'>'+l2+'</option>';}
      reorderWrap.innerHTML='<div class="fg" style="margin-top:4px"><label>'+t('coupleOrder')+'</label><select id="cam-couple-order">'+opts+'</select></div>';
      reorderWrap.style.display='block';
    }else S._reorderPersonId=null;
  }
  openModal('conn-action-modal');
}
function connActionCancel(){closeModal('conn-action-modal');S.actionConnIdx=null;}
function connActionSave(){
  const i=S.actionConnIdx;if(i===null)return;
  const conn=S.connections[i];
  const newType=document.getElementById('cam-type').value;
  conn.type=newType;
  if(newType==='pareja'){
    const orderSel=document.getElementById('cam-couple-order');
    if(orderSel){
      const newIdx=parseInt(orderSel.value);
      const personId=S._reorderPersonId||conn.from;
      const pConns=S.connections.filter(c=>c.type==='pareja'&&(c.from===personId||c.to===personId));
      const oldIdx=pConns.indexOf(conn);
      if(oldIdx!==-1&&newIdx!==oldIdx){
        S.connections.splice(S.connections.indexOf(conn),1);
        const pNew=S.connections.filter(c=>c.type==='pareja'&&(c.from===personId||c.to===personId));
        const insertAfter=newIdx===0?-1:S.connections.indexOf(pNew[newIdx-1]);
        S.connections.splice(insertAfter+1,0,conn);
      }
      S._reorderPersonId=null;
    }
  }
  updateGenDisplay();persist();
  connActionCancel();
  toast(t('linkUpdated'));
}
function connActionDelete(){
  const i=S.actionConnIdx;if(i===null)return;
  connActionCancel();
  S.deletingConn=i;S.deletingId=null;
  const conn=S.connections[i];
  document.getElementById('del-title').textContent=t('deleteLink');
  document.getElementById('del-name').textContent='"'+fullName(S.people[conn.from])+'" ↔ "'+fullName(S.people[conn.to])+'"';
  document.getElementById('del-sub').style.display='none';
  openModal('del-modal');
}

function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    // Downscale to keep localStorage small (cards only need a thumbnail)
    const img=new Image();
    img.onload=()=>{
      const M=320;let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      S.photoData=c.toDataURL('image/jpeg',0.85);
      const box=document.getElementById('photo-box');if(box)box.innerHTML='<img id="photo-prev" src="'+S.photoData+'">';
    };
    img.onerror=()=>{S.photoData=ev.target.result;};
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);e.target.value='';
}
function savePerson(){
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const firstName=v('f-firstname'),middleName=v('f-middlename'),lastName=v('f-lastname');
  if(!firstName&&!lastName){toast(t('nameRequired'));document.getElementById('f-firstname').focus();return;}
  const gEl=document.querySelector('#panel .seg-o.sel[data-g]');
  const gender=gEl?gEl.dataset.g:'masculino';
  S._lastGender=gender;try{localStorage.setItem('gt_lastGender',gender);}catch(e){}
  const data={firstName,middleName,lastName,name:[firstName,middleName,lastName].filter(Boolean).join(' '),gender,
    birth:v('f-birth'),death:v('f-death'),birthplace:v('f-birthplace'),bio:v('f-bio'),photo:S.photoData||null};
  if(S.panelMode==='edit'&&S.editingId){
    const id=S.editingId;
    Object.assign(S.people[id],data);
    if(!data.photo)delete PHOTO_CACHE[id];
    buildCard(id);renderConns();persist();
    toast(t('personUpdated'));
    openDetailPanel(id);
    return;
  }
  const id=uid();
  const quick=S._quickRel;
  const ids=Object.keys(S.people);
  if(S._newNodeX!==undefined){data.x=S._newNodeX;data.y=S._newNodeY;}
  else{
    // drop it in the middle of the current view
    const r=cwEl.getBoundingClientRect();
    data.x=(r.width/2-S.panX)/S.zoom-CARD_W/2+(ids.length%5)*12;
    data.y=(r.height/2-S.panY)/S.zoom-60+(ids.length%5)*12;
  }
  S._newNodeX=undefined;S._newNodeY=undefined;
  S.people[id]=data;buildCard(id);
  document.getElementById('empty').style.display='none';
  closePanel();
  if(quick&&S.people[quick.base]){
    const b=quick.base;
    if(quick.type==='padre')applyRel(id,b,'padre');
    else if(quick.type==='hijo')applyRel(b,id,'padre');
    else applyRel(b,id,quick.type);
  } else {
    renderConns();persist();toast(t('personAdded'));
  }
  selectCard(id);
}
function quickAdd(baseId,type){
  const b=S.people[baseId];if(!b)return;
  const sz=cardSize(baseId);
  S._quickRel={base:baseId,type:type};
  let x=b.x||0,y=b.y||0;
  if(type==='padre'){y-=ROW_STEP;const pars=S.connections.filter(c=>c.type==='padre'&&c.to===baseId).length;x+=pars?COUPLE_SLOT/2:-COUPLE_SLOT/2;}
  else if(type==='hijo'){y+=ROW_STEP;const kids=S.connections.filter(c=>c.type==='padre'&&c.from===baseId).length;x+=kids*(CARD_W+SIB_GAP);}
  else if(type==='pareja'){x+=COUPLE_SLOT;}
  else if(type==='hermano'){x-=CARD_W+SIB_GAP;}
  // avoid landing exactly on someone
  for(let k=0;k<20;k++){const hitId=Object.keys(S.people).find(id=>Math.abs((S.people[id].x||0)-x)<CARD_W*0.8&&Math.abs((S.people[id].y||0)-y)<sz.h*0.8);if(!hitId)break;x+=CARD_W+SIB_GAP;}
  S._newNodeX=x;S._newNodeY=y;
  const q=S._quickRel;
  S.panelMode='add';S.editingId=null;S.photoData=null;
  showPanel(t('qr_'+type)+' · '+esc(fullName(b)),formHTML(null));
  // sensible default gender + surname for children/siblings
  S._quickRel=q;
  bindForm();
  if((type==='hijo'||type==='hermano')&&b.lastName){const ln=document.getElementById('f-lastname');if(ln&&!ln.value)ln.value=b.lastName;}
}

/* ════════════════════════════════════════════════════════════════
   GENERATION IDs  (logic unchanged — IDs drive the vertical band)
   ════════════════════════════════════════════════════════════════ */
function updateGenDisplay(silent){
  if(!S._dbgGen)S._dbgGen={};
  var ids=Object.keys(S.people);
  var adj={};ids.forEach(function(id){adj[id]=[];});
  S.connections.forEach(function(c){
    if(!adj[c.from]||!adj[c.to])return;
    adj[c.from].push({id:c.to,d:(c.type==='padre')?+1:0});
    adj[c.to].push({id:c.from,d:(c.type==='padre')?-1:0});
  });
  var connected=ids.filter(function(id){return adj[id].length>0;});
  ids.forEach(function(id){if(!adj[id].length)delete S._dbgGen[id];});
  Object.keys(S._dbgGen).forEach(function(id){if(!S.people[id])delete S._dbgGen[id];});
  if(connected.length){
    var rel={},visited={};
    connected.forEach(function(start){
      if(visited[start])return;
      var comp=[],q=[start];rel[start]=0;visited[start]=true;
      while(q.length){
        var cur=q.shift();comp.push(cur);
        adj[cur].forEach(function(n){if(rel[n.id]===undefined){rel[n.id]=rel[cur]+n.d;visited[n.id]=true;q.push(n.id);}});
      }
      // Anchor using EXISTING ids (child 1000 → new parent 999); else min level → 1000
      var offsets={},bestOff=null,bestCount=-1;
      comp.forEach(function(id){
        if(S._dbgGen[id]!==undefined){var off=S._dbgGen[id]-rel[id];offsets[off]=(offsets[off]||0)+1;if(offsets[off]>bestCount){bestCount=offsets[off];bestOff=off;}}
      });
      if(bestOff===null){var min=Infinity;comp.forEach(function(id){if(rel[id]<min)min=rel[id];});bestOff=1000-min;}
      comp.forEach(function(id){rel[id]=rel[id]+bestOff;});
    });
    connected.forEach(function(id){S._dbgGen[id]=rel[id];});
  }
  if(!silent)renderAll();
}

function openRelModal(fromId,toId){
  S.relFrom=fromId;S.relTo=toId;
  const a=fullName(S.people[fromId]),b=fullName(S.people[toId]);
  const dup=S.connections.some(c=>(c.from===fromId&&c.to===toId)||(c.from===toId&&c.to===fromId));
  if(dup){toast(t('dupLink'));S.relFrom=null;S.relTo=null;return;}
  const port=S.wiringFromPort||'';
  let opts='';
  if(port==='t'){
    opts+='<option value="hijo" selected>⬆ "'+esc(b)+'" '+t('isParentOf')+' "'+esc(a)+'"</option>';
    opts+='<option value="padre">⬇ "'+esc(a)+'" '+t('isParentOf')+' "'+esc(b)+'"</option>';
    document.getElementById('rel-modal-sub').textContent=t('linkAsParent');
  } else if(port==='b'){
    opts+='<option value="padre" selected>⬇ "'+esc(a)+'" '+t('isParentOf')+' "'+esc(b)+'"</option>';
    opts+='<option value="hijo">⬆ "'+esc(b)+'" '+t('isParentOf')+' "'+esc(a)+'"</option>';
    document.getElementById('rel-modal-sub').textContent=t('linkAsChild');
  } else {
    const lastRel=S._lastSideRel||'pareja';
    opts+='<option value="pareja"'+(lastRel==='pareja'?' selected':'')+'>↔ '+t('couple')+'</option>';
    opts+='<option value="hermano"'+(lastRel==='hermano'?' selected':'')+'>↔ '+t('sibling')+'</option>';
    document.getElementById('rel-modal-sub').textContent=a+' ↔ '+b;
  }
  document.getElementById('rel-modal-title').textContent=t('linkType');
  document.getElementById('rel-type').innerHTML=opts;
  openModal('rel-modal');
  setTimeout(()=>{const s=document.getElementById('rel-type');if(s&&window.innerWidth>760)s.focus();},50);
}
function cancelRel(){closeModal('rel-modal');S.relFrom=null;S.relTo=null;}
function confirmRel(){
  const from=S.relFrom,to=S.relTo;if(!from||!to){closeModal('rel-modal');return;}
  const type=document.getElementById('rel-type').value;
  closeModal('rel-modal');
  if(type==='pareja'||type==='hermano'){S._lastSideRel=type;try{localStorage.setItem('gt_lastSideRel',type);}catch(e){}}
  applyRel(from,to,type);
}
function applyRel(from,to,type){
  S.relFrom=from;S.relTo=to;
  if(type==='hijo'){const tmp=from;from=to;to=tmp;type='padre';}
  if(S.connections.some(c=>(c.from===from&&c.to===to)||(c.from===to&&c.to===from))){toast(t('dupLink'));S.relFrom=null;S.relTo=null;return;}
  S.connections.push({from:from,to:to,type:type});
  updateGenDisplay();persist();

  // Hermano shortcut: if one sibling has parents, offer to link the other
  if(type==='hermano'){
    const parentsOfFrom=S.connections.filter(c=>c.type==='padre'&&c.to===from).map(c=>c.from);
    const parentsOfTo=S.connections.filter(c=>c.type==='padre'&&c.to===to).map(c=>c.from);
    const knownParents=parentsOfFrom.length?parentsOfFrom:(parentsOfTo.length?parentsOfTo:null);
    const nodeWithout=parentsOfFrom.length&&!parentsOfTo.length?to:(!parentsOfFrom.length&&parentsOfTo.length?from:null);
    if(knownParents&&nodeWithout){
      const parentNames=knownParents.map(pid=>'"'+fullName(S.people[pid])+'"').join(' '+t('and')+' ');
      S._pendingHermano={child:nodeWithout,parents:knownParents,relFrom:S.relFrom||from};
      askProp('"'+fullName(S.people[nodeWithout])+'" '+t('alsoChildOf')+' '+parentNames+'?');
      return;
    }
  }
  // padre: are the child's SIBLINGS also this parent's children?
  if(type==='padre'){
    const parentId0=from,childId0=to;
    let sibs=S.connections.filter(c=>c.type==='hermano'&&(c.from===childId0||c.to===childId0)).map(c=>c.from===childId0?c.to:c.from)
      .filter(sib=>!S.connections.some(c=>c.type==='padre'&&c.from===parentId0&&c.to===sib));
    sibs=sibs.filter((v,i)=>sibs.indexOf(v)===i);
    if(sibs.length){
      const sibNames=sibs.map(s=>'"'+fullName(S.people[s])+'"').join(' '+t('and')+' ');
      S._pendingSibParent={parent:parentId0,sibs:sibs,relFrom:S.relFrom||from,origChild:childId0};
      askProp(sibNames+' '+(sibs.length>1?t('alsoChildrenOf'):t('alsoChildOf'))+' "'+fullName(S.people[parentId0])+'"?');
      return;
    }
  }
  // padre: is the parent's partner also the child's parent?
  if(type==='padre'){if(askPartnerParent(from,to,S.relFrom||from))return;}
  // padre: same parent-set as someone else → siblings?
  if(type==='padre'){if(askSameParentSiblings(to,S.relFrom||from))return;}
  // padre: second parent added → are both parents a couple?
  if(type==='padre'){
    const allPars=S.connections.filter(c=>c.type==='padre'&&c.to===to).map(c=>c.from);
    if(allPars.length===2){
      const p1=allPars[0],p2=allPars[1];
      const alreadyCouple=S.connections.some(c=>c.type==='pareja'&&((c.from===p1&&c.to===p2)||(c.from===p2&&c.to===p1)));
      if(!alreadyCouple){
        S._pendingCouple={p1:p1,p2:p2};S._pendingCoupleMode=true;
        askProp('"'+fullName(S.people[p1])+'" '+t('and')+' "'+fullName(S.people[p2])+'" '+t('areCouple'));
        return;
      }
    }
  }
  // pareja: partner already has kids → are they the other partner's kids too?
  if(type==='pareja'){
    const pa=from,pb=to;
    const kidsA=S.connections.filter(c=>c.type==='padre'&&c.from===pa).map(c=>c.to);
    const kidsB=S.connections.filter(c=>c.type==='padre'&&c.from===pb).map(c=>c.to);
    const onlyA=kidsA.filter(k=>kidsB.indexOf(k)<0),onlyB=kidsB.filter(k=>kidsA.indexOf(k)<0);
    let gainParent=null,kidsToAdd=null;
    if(onlyA.length){gainParent=pb;kidsToAdd=onlyA;} else if(onlyB.length){gainParent=pa;kidsToAdd=onlyB;}
    if(gainParent&&kidsToAdd&&kidsToAdd.length){
      const kidNames=kidsToAdd.map(k=>'"'+fullName(S.people[k])+'"').join(' '+t('and')+' ');
      S._pendingSibParent={parent:gainParent,sibs:kidsToAdd,relFrom:S.relFrom||from};
      askProp(kidNames+' '+(kidsToAdd.length>1?t('alsoChildrenOf'):t('alsoChildOf'))+' "'+fullName(S.people[gainParent])+'"?');
      return;
    }
  }
  // pareja: place the partner on the side away from the siblings
  if(type==='pareja'){
    const mainP=S.people[from],partnerP=S.people[to];
    if(mainP&&partnerP){
      const hermX=[];
      S.connections.forEach(c=>{if(c.type!=='hermano')return;const other=c.from===from?c.to:c.to===from?c.from:null;if(other&&S.people[other])hermX.push(S.people[other].x||0);});
      if(hermX.length){
        const avg=hermX.reduce((s,x)=>s+x,0)/hermX.length;
        partnerP.x=(avg<(mainP.x||0))?(mainP.x||0)+COUPLE_SLOT:(mainP.x||0)-COUPLE_SLOT;
        partnerP.y=mainP.y;
        moveCardEl(to);renderConns();persist();
      }
    }
  }
  openDetailPanel(S.relFrom||from);
  S.relFrom=null;S.relTo=null;S.wiringFromPort=null;
  toast(t('linkCreated'),{action:t('undo'),fn:undo});
}
function askProp(text){
  document.getElementById('hermano-q-text').textContent=text;
  openModal('hermano-modal');
  S.relFrom=null;S.relTo=null;S.wiringFromPort=null;
}
function askSameParentSiblings(theChild,relFrom){
  const myParents=S.connections.filter(c=>c.type==='padre'&&c.to===theChild).map(c=>c.from).sort();
  if(!myParents.length)return false;
  const myKey=myParents.join('+');
  const others=Object.keys(S.people).filter(pid=>{
    if(pid===theChild)return false;
    const pp=S.connections.filter(c=>c.type==='padre'&&c.to===pid).map(c=>c.from).sort();
    return pp.length===myParents.length&&pp.join('+')===myKey;
  }).filter(sib=>!S.connections.some(c=>c.type==='hermano'&&((c.from===theChild&&c.to===sib)||(c.from===sib&&c.to===theChild))));
  if(!others.length)return false;
  const othNames=others.map(s=>'"'+fullName(S.people[s])+'"').join(' '+t('and')+' ');
  S._pendingSiblingLink={child:theChild,sibs:others,relFrom:relFrom};
  askProp('"'+fullName(S.people[theChild])+'" '+t('isSiblingOf')+' '+othNames+'?');
  return true;
}
function askPartnerParent(parentId,childId,relFrom){
  const couple=S.connections.find(c=>c.type==='pareja'&&(c.from===parentId||c.to===parentId));
  if(!couple)return false;
  const partnerId=couple.from===parentId?couple.to:couple.from;
  if(S.connections.some(c=>c.type==='padre'&&c.from===partnerId&&c.to===childId))return false;
  S._pendingHermano={child:childId,parents:[partnerId],relFrom:relFrom};
  askProp('"'+fullName(S.people[childId])+'" '+t('alsoChildOf')+' "'+fullName(S.people[partnerId])+'"?');
  return true;
}
function afterPadreLinked(parentId,relFrom,children){
  if(children&&children.length&&askPartnerParentMulti(parentId,children,relFrom))return;
  openDetailPanel(relFrom||parentId);
  toast(t('linkCreated'),{action:t('undo'),fn:undo});
}
function askPartnerParentMulti(parentId,children,relFrom){
  const couple=S.connections.find(c=>c.type==='pareja'&&(c.from===parentId||c.to===parentId));
  if(!couple)return false;
  const partnerId=couple.from===parentId?couple.to:couple.from;
  const need=children.filter(k=>!S.connections.some(c=>c.type==='padre'&&c.from===partnerId&&c.to===k));
  if(!need.length)return false;
  const names=need.map(k=>'"'+fullName(S.people[k])+'"').join(' '+t('and')+' ');
  S._pendingSibParent={parent:partnerId,sibs:need,relFrom:relFrom,origChild:null};
  askProp(names+' '+(need.length>1?t('alsoChildrenOf'):t('alsoChildOf'))+' "'+fullName(S.people[partnerId])+'"?');
  return true;
}
function confirmHermanoParents(){
  closeModal('hermano-modal');
  if(S._pendingSiblingLink){
    const sl=S._pendingSiblingLink;S._pendingSiblingLink=null;
    sl.sibs.forEach(sib=>{
      const dup=S.connections.some(c=>c.type==='hermano'&&((c.from===sl.child&&c.to===sib)||(c.from===sib&&c.to===sl.child)));
      if(!dup)S.connections.push({from:sl.child,to:sib,type:'hermano'});
    });
    updateGenDisplay();persist();
    openDetailPanel(sl.relFrom||sl.child);toast(t('linkCreated'),{action:t('undo'),fn:undo});
    return;
  }
  if(S._pendingSibParent){
    const sp=S._pendingSibParent;S._pendingSibParent=null;
    sp.sibs.forEach(sib=>{if(!S.connections.some(c=>c.type==='padre'&&c.from===sp.parent&&c.to===sib))S.connections.push({from:sp.parent,to:sib,type:'padre'});});
    updateGenDisplay();persist();
    afterPadreLinked(sp.parent,sp.relFrom,sp.origChild?[sp.origChild].concat(sp.sibs):sp.sibs);
    return;
  }
  if(S._pendingCoupleMode){
    S._pendingCoupleMode=false;
    const pc=S._pendingCouple;S._pendingCouple=null;
    if(pc){S.connections.push({from:pc.p1,to:pc.p2,type:'pareja'});updateGenDisplay();persist();toast(t('linkCreated'),{action:t('undo'),fn:undo});}
    return;
  }
  const info=S._pendingHermano;S._pendingHermano=null;
  if(!info)return;
  info.parents.forEach(pid=>{if(!S.connections.some(c=>c.type==='padre'&&c.from===pid&&c.to===info.child))S.connections.push({from:pid,to:info.child,type:'padre'});});
  updateGenDisplay();persist();
  if(askSameParentSiblings(info.child,info.relFrom))return;   // now shares both parents with someone?
  toast(t('linkCreated'),{action:t('undo'),fn:undo});
  openDetailPanel(info.relFrom||info.child);
}
function cancelHermanoParents(){
  closeModal('hermano-modal');
  if(S._pendingSiblingLink){const sl=S._pendingSiblingLink;S._pendingSiblingLink=null;openDetailPanel(sl.relFrom||sl.child);toast(t('linkCreated'));return;}
  if(S._pendingSibParent){const sp=S._pendingSibParent;S._pendingSibParent=null;afterPadreLinked(sp.parent,sp.relFrom,sp.origChild?[sp.origChild].concat(sp.sibs):sp.sibs);return;}
  S._pendingCoupleMode=false;S._pendingCouple=null;
  const info=S._pendingHermano;S._pendingHermano=null;
  if(info)openDetailPanel(info.relFrom||info.child);
  toast(t('linkCreated'));
}

/* ════════════════════════════════════════════════════════════════
   COPY / PASTE / IMPORT / EXPORT
   ════════════════════════════════════════════════════════════════ */
function copyTree(){
  const selectedIds=[...S.selectedIds];
  const copyAll=selectedIds.length===0;
  const ids=copyAll?Object.keys(S.people):selectedIds;
  if(!ids.length){toast(t('nothingToCopy'));return;}
  const people={};ids.forEach(id=>{if(S.people[id])people[id]=S.people[id];});
  const connections=S.connections.filter(c=>ids.includes(c.from)&&ids.includes(c.to));
  const collapsed={};ids.forEach(id=>{if(S.collapsed[id])collapsed[id]=true;});
  const gens={};ids.forEach(id=>{if(S._dbgGen[id]!==undefined)gens[id]=S._dbgGen[id];});
  const data=JSON.stringify({people,connections,nextId:S.nextId,collapsed,_dbgGen:gens,_v:'arbolito-v'+VERSION,_ts:Date.now(),_partial:!copyAll,_count:ids.length});
  const label=copyAll?t('copiedAll').replace('{n}',ids.length):t('copiedSome').replace('{n}',ids.length);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(()=>toast(label)).catch(()=>showCopyFallback(data));
  } else showCopyFallback(data);
}
function showCopyFallback(data){
  document.getElementById('copy-fallback-area').value=data;openModal('copy-fallback-modal');
  setTimeout(()=>document.getElementById('copy-fallback-area').select(),100);
}
function pasteTree(){
  const fallback=()=>{openModal('paste-fallback-modal');setTimeout(()=>document.getElementById('paste-fallback-area').focus(),100);};
  if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(tryImportText).catch(fallback);
  else fallback();
}
function tryImportText(text){
  let d;
  try{d=JSON.parse(String(text||'').trim());}catch(e){toast(t('pasteInvalid'));return;}
  if(!d||typeof d!=='object'||(!d.people&&!d._v)){toast(t('pasteNotTree'));return;}
  const hasData=Object.keys(S.people).length>0;
  if(hasData&&!d._partial){
    S._pendingImport=d;
    document.getElementById('paste-confirm-msg').textContent=t('replaceMsg');
    openModal('paste-confirm-modal');
  } else applyImport(d);
}
function applyImport(d){
  if(d._partial){
    const idMap={};
    const r=cwEl.getBoundingClientRect();
    const src=Object.keys(d.people||{});
    let mnx=1e9,mny=1e9;src.forEach(o=>{mnx=Math.min(mnx,d.people[o].x||0);mny=Math.min(mny,d.people[o].y||0);});
    const at=S._pasteAt;S._pasteAt=null;
    const cx=at?at.x:(r.width/2-S.panX)/S.zoom-CARD_W,cy=at?at.y:(r.height/2-S.panY)/S.zoom-80;
    src.forEach(oldId=>{
      const newId=uid();idMap[oldId]=newId;
      const p=JSON.parse(JSON.stringify(d.people[oldId]));
      p.x=(p.x||0)-mnx+cx;p.y=(p.y||0)-mny+cy;
      S.people[newId]=p;
      if(d.collapsed&&d.collapsed[oldId])S.collapsed[newId]=true;
      if(d._dbgGen&&d._dbgGen[oldId]!==undefined)S._dbgGen[newId]=d._dbgGen[oldId];
    });
    (d.connections||[]).forEach(c=>{const nf=idMap[c.from],nt=idMap[c.to];if(nf&&nt)S.connections.push({from:nf,to:nt,type:c.type});});
    S.selectedIds.clear();Object.values(idMap).forEach(n=>S.selectedIds.add(n));
    S.selectedId=Object.values(idMap)[0]||null;
    sanitize();updateGenDisplay();persist();
    const np=Object.keys(idMap).length;toast((np===1?t('pasted1'):t('pasted')).replace('{n}',np),{action:t('undo'),fn:undo});
  } else {
    S.people=d.people||{};S.connections=d.connections||[];S.nextId=d.nextId||1;S.collapsed=d.collapsed||{};
    S._dbgGen=d._dbgGen||{};S._secCollapsed=d._secCollapsed||{};S.famCollapsed=d.famCollapsed||{};
    clearSelection();closePanel();
    sanitize();updateGenDisplay();persist();fitScreen(true);
    toast(t('imported'),{action:t('undo'),fn:undo});
  }
}
function confirmPasteImport(){closeModal('paste-confirm-modal');const d=S._pendingImport;S._pendingImport=null;if(d)applyImport(d);}
function cancelPasteImport(){closeModal('paste-confirm-modal');S._pendingImport=null;}
function doPasteFallback(){
  const text=document.getElementById('paste-fallback-area').value;
  closeModal('paste-fallback-modal');document.getElementById('paste-fallback-area').value='';
  tryImportText(text);
}
function exportData(){
  const a=document.createElement('a');
  const d=new Date();const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({people:S.people,connections:S.connections,nextId:S.nextId,collapsed:S.collapsed,_dbgGen:S._dbgGen,_secCollapsed:S._secCollapsed,famCollapsed:S.famCollapsed,_v:'arbolito-v'+VERSION},null,2)],{type:'application/json'}));
  a.download='arbolito-'+stamp+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(t('exported'));
}
function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    let d;try{d=JSON.parse(ev.target.result);}catch(err){toast(t('importError'));return;}
    if(!d||!d.people){toast(t('importError'));return;}
    d._partial=false;
    if(Object.keys(S.people).length){S._pendingImport=d;document.getElementById('paste-confirm-msg').textContent=t('replaceMsgFile');openModal('paste-confirm-modal');}
    else applyImport(d);
  };
  r.readAsText(f);e.target.value='';
}

   TOAST
   ════════════════════════════════════════════════════════════════ */
function toast(msg,opt){
  const el=document.getElementById('toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(opt&&opt.action?'<button class="t-act">'+esc(opt.action)+'</button>':'');

/* ════════════════════════════════════════════════════════════════
   ALINEAR  (snapToGrid — sin cambios)
   ════════════════════════════════════════════════════════════════ */
function snapToGrid(onlyIds, yOnly){
  var ids=onlyIds?[...onlyIds]:Object.keys(S.people);
  if(!ids.length)return;
  var TOL_Y=110;
  var TOL_X=4;
  S.connections.forEach(function(c){
    if(c.type!=='pareja')return;
    var aHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.from;});
    var bHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.to;});
    if(aHasPar===bHasPar)return;
    var anchorId=aHasPar?c.from:c.to;
    var floatId=aHasPar?c.to:c.from;
    var anchorHasSib=S.connections.some(function(x){return x.type==='hermano'&&(x.from===anchorId||x.to===anchorId);});
    if(!anchorHasSib)return;
    var anchor=S.people[anchorId],floater=S.people[floatId];
    if(!anchor||!floater)return;
    var key='_roff_'+[anchorId,floatId].sort().join('|');
    S[key]=(floater.x||0)-(anchor.x||0);
  });
  var yGroups=[];
  ids.forEach(function(id){
    var p=S.people[id];if(!p)return;
    var y=p.y||0;var found=false;
    yGroups.forEach(function(g){if(Math.abs(g.median-y)<TOL_Y){g.ids.push(id);g.sum+=y;g.median=g.sum/g.ids.length;found=true;}});
    if(!found)yGroups.push({ids:[id],sum:y,median:y});
  });
  yGroups.forEach(function(g){var targetY=Math.round(g.median/10)*10;g.ids.forEach(function(id){S.people[id].y=targetY;});});
  if(!yOnly){
    var xGroups=[];
    ids.forEach(function(id){
      var p=S.people[id];if(!p)return;
      var x=p.x||0;var found=false;
      xGroups.forEach(function(g){if(Math.abs(g.median-x)<TOL_X){g.ids.push(id);g.sum+=x;g.median=g.sum/g.ids.length;found=true;}});
      if(!found)xGroups.push({ids:[id],sum:x,median:x});
    });
    var rigidFloats=new Set();
    S.connections.forEach(function(c){
      if(c.type!=='pareja')return;
      var aHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.from;});
      var bHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.to;});
      if(aHasPar===bHasPar)return;
      var floatId=aHasPar?c.to:c.from;
      var anchorId=aHasPar?c.from:c.to;
      var anchorHasSib=S.connections.some(function(x){return x.type==='hermano'&&(x.from===anchorId||x.to===anchorId);});
      if(anchorHasSib)rigidFloats.add(floatId);
    });
    xGroups.forEach(function(g){
      if(g.ids.length<2)return;
      var targetX=Math.round(g.median/10)*10;
      g.ids.forEach(function(id){if(rigidFloats.has(id))return;S.people[id].x=targetX;});
    });
  }
  if(!onlyIds){
    var allIds=Object.keys(S.people);
    var rootIds=allIds.filter(function(id){return !S.connections.some(function(c){return c.type==='padre'&&c.to===id;});});
    recenterChildren(rootIds);
  }
  persist();renderAll();
  if(!onlyIds)toast(t('aligned'),{action:t('undo'),fn:undo});
}

function updateFollowerOffset(dragId){
  S.connections.forEach(function(c){
    if(c.type!=='pareja'&&c.type!=='hermano')return;
    if(c.from!==dragId&&c.to!==dragId)return;
    var otherId=c.from===dragId?c.to:c.from;
    var dragHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===dragId;});
    var otherHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===otherId;});
    if(dragHasPar)return;
    if(!otherHasPar)return;
    var anchor=S.people[otherId],floater=S.people[dragId];
    if(!anchor||!floater)return;
    var key='_roff_'+[otherId,dragId].sort().join('|');
    S[key]=(floater.x||0)-(anchor.x||0);
  });
}
function followRigidCouple(anchorId){
  var anchorHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===anchorId;});
  if(!anchorHasPar)return;
  S.connections.forEach(function(c){
    if(c.type!=='pareja'&&c.type!=='hermano')return;
    var cpId=c.from===anchorId?c.to:c.to===anchorId?c.from:null;
    if(!cpId)return;
    var cp=S.people[cpId];if(!cp)return;
    var cpHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===cpId;});
    if(cpHasPar)return;
    var anchor=S.people[anchorId];if(!anchor)return;
    var key='_roff_'+[anchorId,cpId].sort().join('|');
    if(S[key]===undefined)S[key]=(cp.x||0)-(anchor.x||0);
    var dx=(anchor.x||0)+S[key]-(cp.x||0);
    var dy=(anchor.y||0)-(cp.y||0);
    var sub=[cpId],seen=new Set([cpId]),q=[cpId];
    while(q.length){var cur=q.shift();S.connections.forEach(function(x){if(x.type==='padre'&&x.from===cur&&!seen.has(x.to)){seen.add(x.to);q.push(x.to);sub.push(x.to);}});}
    sub.forEach(function(sid){var sp=S.people[sid];if(!sp)return;sp.x=(sp.x||0)+dx;sp.y=(sp.y||0)+dy;moveCardEl(sid);});
  });
}

/* Keep children centered under their parents while dragging / aligning.
   v3: the sibling group moves RIGIDLY (keeps the spacing Reorganizar gave it);
   it only opens up when two siblings would overlap. */
function recenterChildren(movedIds){
  var MIN=CARD_W+SIB_GAP;
  var visited=new Set();
  var moved=new Set(movedIds);
  function getSiblingGroups(parentId){
    var groups={};
    S.connections.forEach(function(c){
      if(c.type!=='padre'||c.from!==parentId)return;
      var childId=c.to;var pars=[];
      S.connections.forEach(function(c2){if(c2.type==='padre'&&c2.to===childId)pars.push(c2.from);});
      var key=pars.slice().sort().join('|');
      if(!groups[key])groups[key]={pars:pars,kids:[]};
      if(groups[key].kids.indexOf(childId)<0)groups[key].kids.push(childId);
    });
    return Object.values(groups);
  }
  function centerKids(parentId){
    if(visited.has(parentId))return;
    visited.add(parentId);
    getSiblingGroups(parentId).forEach(function(g){
      var kids=g.kids.filter(function(k){return S.people[k];});
      if(!kids.length)return;
      var parCenters=g.pars.filter(function(pid){return S.people[pid];}).map(function(pid){return (S.people[pid].x||0)+CARD_W/2;});
      if(!parCenters.length)return;
      var midC=(Math.min.apply(null,parCenters)+Math.max.apply(null,parCenters))/2;
      kids.sort(function(a,b){return (S.people[a].x||0)-(S.people[b].x||0);});
      // relative offsets, opened up where siblings would overlap
      var rel=[0];
      for(var i=1;i<kids.length;i++){var gap=(S.people[kids[i]].x||0)-(S.people[kids[i-1]].x||0);rel.push(rel[i-1]+Math.max(gap,MIN));}
      var span=rel[rel.length-1];
      var startX=midC-CARD_W/2-span/2;
      kids.forEach(function(childId,i){
        if(moved.has(childId))return;
        var child=S.people[childId];
        child.x=startX+rel[i];
        moveCardEl(childId);
        followRigidCouple(childId);
      });
      kids.forEach(function(childId){centerKids(childId);});
    });
  }
  movedIds.forEach(function(id){followRigidCouple(id);centerKids(id);});
}

/* ════════════════════════════════════════════════════════════════
   REORGANIZAR  (v3 layout engine)

   Rules (same as before, now enforced globally instead of by pushing right):
   • The generation IDs decide the row (vertical band).
   • The left→right order the user already has is FROZEN (per row, by current X).
   • Children are centered under the midpoint of their two parents.
   • Married-in partners stick to their spouse, on the side away from the siblings.
   • Cross-family couples (both have parents) each stay with their own family,
     but are moved to the edge of their sibling group that faces the partner.
   • Grandparents / upper generations center OVER their children, wherever they are.
   • Separate trees are laid out side by side and never interleave.

   How:
   1. Rows from the IDs; units = person or couple chain; families kept contiguous.
   2. Family order: parent-less units follow their children first (so newly added
      grandparents never reshuffle anything), then families follow their parents.
      Ties keep the current X order.
   3. Positions minimise one quadratic energy (children's span centred under the
      parents + soft springs that keep rows tight) under the order/min-gap
      constraints, with accelerated projected gradient; each projection is an exact
      weighted isotonic regression (PAVA) per row. Overlaps are resolved on both
      sides, so a growing family pushes its neighbours apart symmetrically instead
      of shoving the whole row to the right, and conflicting cross-family marriages
      can no longer make branches drift apart.
   ════════════════════════════════════════════════════════════════ */
function pavaSolve(desired,weight,sep){
  // minimise Σ w(x−d)²  s.t.  x[i+1]−x[i] ≥ sep[i]
  const n=desired.length;if(!n)return[];
  const c=new Array(n);c[0]=0;for(let i=1;i<n;i++)c[i]=c[i-1]+sep[i-1];
  const blocks=[];
  for(let i=0;i<n;i++){
    blocks.push({v:desired[i]-c[i],w:weight[i],n:1});
    while(blocks.length>1&&blocks[blocks.length-2].v>blocks[blocks.length-1].v){
      const b=blocks.pop(),a=blocks.pop();const w=a.w+b.w;
      blocks.push({v:(a.v*a.w+b.v*b.w)/w,w:w,n:a.n+b.n});
    }
  }
  const out=new Array(n);let i=0;
  blocks.forEach(b=>{for(let k=0;k<b.n;k++,i++)out[i]=b.v+c[i];});
  return out;
}

function computeLayout(){
  computeHidden();
  const ids=visIds();
  updateGenDisplay(true);
  const G=graph();
  const cur={};ids.forEach(id=>{cur[id]=(S.people[id].x||0)+CARD_W/2;});
  const loose=ids.filter(id=>!G.deg[id]);
  const conn=ids.filter(id=>G.deg[id]);
  const gen={};conn.forEach(id=>{gen[id]=S._dbgGen[id]!==undefined?S._dbgGen[id]:1000;});
  const hasPar=id=>G.par[id].length>0;

  /* components */
  const U={};const f=x=>U[x]===x?x:(U[x]=f(U[x]));
  conn.forEach(id=>{U[id]=id;});
  VCONNS.forEach(c=>{if(U[c.from]!==undefined&&U[c.to]!==undefined){const a=f(c.from),b=f(c.to);if(a!==b)U[a]=b;}});
  const compMap={};conn.forEach(id=>{(compMap[f(id)]=compMap[f(id)]||[]).push(id);});
  const comps=Object.values(compMap).map(m=>({m,cx:m.reduce((s,id)=>s+cur[id],0)/m.length}));
  comps.sort((a,b)=>a.cx-b.cx);

  const center={};let cursor=0;
  comps.forEach(comp=>{
    const res=layoutComponent(comp.m,G,gen,cur,hasPar);
    let mn=1e9,mx=-1e9;comp.m.forEach(id=>{mn=Math.min(mn,res[id]);mx=Math.max(mx,res[id]);});
    comp.m.forEach(id=>{center[id]=res[id]-mn+cursor+CARD_W/2;});
    cursor+=(mx-mn)+CARD_W+COMP_GAP;
  });

  const gl=[...new Set(conn.map(id=>gen[id]))].sort((a,b)=>a-b);
  const rowIdx={};gl.forEach((g,i)=>{rowIdx[g]=i;});
  const pos={};
  conn.forEach(id=>{pos[id]={x:center[id]-CARD_W/2,y:rowIdx[gen[id]]*ROW_STEP};});
  if(loose.length){
    loose.sort((a,b)=>cur[a]-cur[b]);
    const ly=gl.length*ROW_STEP+(gl.length?40:0);
    loose.forEach((id,i)=>{pos[id]={x:i*(CARD_W+SIB_GAP),y:ly};});
  }
  // keep the tree where it was on screen (match old/new bounding-box centres)
  let ox1=1e9,ox2=-1e9,oy1=1e9,oy2=-1e9,nx1=1e9,nx2=-1e9,ny1=1e9,ny2=-1e9;
  ids.forEach(id=>{const p=S.people[id];ox1=Math.min(ox1,p.x||0);ox2=Math.max(ox2,p.x||0);oy1=Math.min(oy1,p.y||0);oy2=Math.max(oy2,p.y||0);
    nx1=Math.min(nx1,pos[id].x);nx2=Math.max(nx2,pos[id].x);ny1=Math.min(ny1,pos[id].y);ny2=Math.max(ny2,pos[id].y);});
  const dx=Math.round((ox1+ox2)/2-(nx1+nx2)/2),dy=Math.round(oy1-ny1);
  ids.forEach(id=>{pos[id].x=Math.round(pos[id].x+dx);pos[id].y=Math.round(pos[id].y+dy);});
  return pos;
}

function layoutComponent(members,G,gen,cur,hasPar){
  const inComp=new Set(members);
  const rowsMap={};members.forEach(id=>{(rowsMap[gen[id]]=rowsMap[gen[id]]||[]).push(id);});
  const gens=Object.keys(rowsMap).map(Number).sort((a,b)=>a-b);
  const parKey=id=>G.par[id].slice().sort().join('+');
  const rows=[];        // [{units:[...], sep:[...]}]
  const unitOf={};      // person → unit
  const off={};         // person → offset from unit centre

  /* sibling groups: people with parents group by their parent set ('g:'); parent-less
     people linked as hermanos join their sibling's group, or form their own ('h:') */
  const sibRoot={};
  {
    const P2={};const f2=x=>P2[x]===x?x:(P2[x]=f2(P2[x]));
    members.forEach(id=>{P2[id]=id;});
    members.forEach(id=>G.sib[id].forEach(o=>{if(inComp.has(o)&&gen[o]===gen[id]){const a=f2(id),b=f2(o);if(a!==b)P2[a]=b;}}));
    const rootPar={};members.forEach(id=>{const r=f2(id);if(hasPar(id)&&!rootPar[r])rootPar[r]=id;});
    members.forEach(id=>{const r=f2(id);sibRoot[id]=G.sib[id].some(o=>inComp.has(o)&&gen[o]===gen[id])?(rootPar[r]?'g:'+parKey(rootPar[r]):'h:'+r):null;});
  }
  const grpKey=id=>hasPar(id)?'g:'+parKey(id):sibRoot[id];
  const isAnchor=id=>!!grpKey(id);

  /* ── 1. build units (couple chains) and the frozen order of every row ── */
  gens.forEach((g,ri)=>{
    const N=rowsMap[g];const inRow=new Set(N);
    const P={},AC={};N.forEach(id=>{P[id]=id;AC[id]=isAnchor(id)?1:0;});
    const fd=x=>P[x]===x?x:(P[x]=fd(P[x]));
    const linked={};N.forEach(id=>{linked[id]=[];});
    VCONNS.forEach(c=>{
      if(c.type!=='pareja'||!inRow.has(c.from)||!inRow.has(c.to))return;
      if(isAnchor(c.from)&&isAnchor(c.to))return;           // cross-family: no merge
      const a=fd(c.from),b=fd(c.to);if(a===b)return;
      if(AC[a]&&AC[b])return;                                // would join two families
      P[a]=b;AC[b]+=AC[a];linked[c.from].push(c.to);linked[c.to].push(c.from);
    });
    const cl={};N.forEach(id=>{(cl[fd(id)]=cl[fd(id)]||[]).push(id);});
    const units=Object.values(cl).map(mem=>{
      const anchor=mem.find(hasPar)||mem.find(isAnchor)||null;
      return {mem,anchor,key:anchor?grpKey(anchor):null,cx:mem.reduce((s,id)=>s+cur[id],0)/mem.length,row:ri};
    });
    // items = sibling groups (contiguous) + free units
    const items={};const list=[];
    units.forEach((u,i)=>{
      const k=u.key||('f:'+i);
      if(!items[k]){items[k]={k,units:[]};list.push(items[k]);}
      items[k].units.push(u);
    });
    list.forEach(it=>{
      const anchors=it.units.map(u=>u.anchor||u.mem[0]);
      it.cx=anchors.reduce((s,id)=>s+cur[id],0)/anchors.length;
      it.units.sort((a,b)=>cur[a.anchor||a.mem[0]]-cur[b.anchor||b.mem[0]]);
      it.free=it.k.startsWith('f:');it.real=it.k.startsWith('g:');
      it.w=it.units.reduce((s,u)=>s+(u.mem.length-1)*COUPLE_SLOT+CARD_W,0)+(it.units.length-1)*SIB_GAP;
      it.units.forEach(u=>{u.item=it;});
    });
    list.sort((a,b)=>a.cx-b.cx);
    rows.push({list,inRow,linked,g});
  });

  /* ── 1b. crossing reduction on the ORDER of families (not inside them) ──
     Up first: parent-less units (e.g. grandparents added later) move over their
     children, so adding ancestors never reshuffles the families below.
     Then down: families with parents line up under their parents (person-level
     positions, so the kids of two siblings follow those siblings' order).
     Ties keep the current X order. */
  const ppx={};
  const _desc={};
  const descOf=id=>{
    if(_desc[id])return _desc[id];
    const set=new Set([id]),q=[id];
    while(q.length){const x=q.shift();G.ch[x].forEach(k=>{if(!set.has(k)&&inComp.has(k)){set.add(k);q.push(k);}});}
    return _desc[id]=set;
  };
  rows.forEach(row=>row.list.forEach(it=>it.units.forEach(u=>{u.order=u.mem.slice().sort((a,b)=>cur[a]-cur[b]);})));
  const pack=row=>{
    let x=0;
    row.list.forEach((it,i)=>{
      if(i>0)x+=FAM_GAP;
      let ux=x;
      it.units.forEach((u,ui)=>{
        if(ui>0)ux+=SIB_GAP;
        u.order.forEach((m,j)=>{ppx[m]=ux+CARD_W/2+j*COUPLE_SLOT;});
        ux+=(u.order.length-1)*COUPLE_SLOT+CARD_W;
      });
      it.px=x+it.w/2;x+=it.w;
    });
  };
  const has=id=>ppx[id]!==undefined;
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
  // inside a family: cross-family partners go to the edge facing the partner's family,
  // married-in partners go to the side away from the siblings
  // how much "world" hangs from a sibling through its partners and descendants
  const _w={};
  const worldW=u=>{
    if(_w[u.anchor]!==undefined)return _w[u.anchor];
    const block=new Set([u.anchor].concat(G.par[u.anchor]));
    u.item.units.forEach(v=>{if(v!==u)v.mem.forEach(m=>block.add(m));});
    const seen=new Set(),q=[];
    u.mem.concat(G.coup[u.anchor],G.ch[u.anchor]).forEach(x=>{if(!block.has(x)&&!seen.has(x)){seen.add(x);q.push(x);}});
    while(q.length&&seen.size<500){const x=q.shift();[G.par[x],G.ch[x],G.coup[x],G.sib[x]].forEach(L=>L.forEach(y=>{if(!block.has(y)&&!seen.has(y)){seen.add(y);q.push(y);}}));}
    return _w[u.anchor]=seen.size;
  };
  /* inside a sibling group:
     • siblings without a partner stay in the middle (in their current order);
     • siblings with a partner go to the ends, their partner on the outside, on the
       side where their branch joins another tree (cross marriages of them or of
       their descendants);
     • with several partnered siblings, the one with more family behind its partner
       (more data entered) goes further out. */
  const arrange=row=>{
    const {list,inRow,linked}=row;
    const itemOfKey={};list.forEach(it=>{if(!it.free)itemOfKey[it.k]=it;});
    list.forEach(it=>{
      if(it.free)return;
      it.units.forEach(u=>{
        let dir=0;
        G.coup[u.anchor].forEach(b=>{
          if(!inRow.has(b)||!isAnchor(b))return;
          const other=itemOfKey[grpKey(b)];if(!other||other===it)return;
          dir+=Math.sign(other.px-it.px);
        });
        u.want=Math.sign(dir);
        const ds=descOf(u.anchor);let d2=0;
        ds.forEach(d=>{
          if(!isAnchor(d))return;
          G.coup[d].forEach(b=>{
            if(!isAnchor(b)||ds.has(b)||ppx[b]===undefined)return;
            d2+=Math.sign(ppx[b]-it.px)*(d===u.anchor?2:1);
          });
        });
        u.pull=Math.sign(d2)||u.want;
        u.partnered=u.mem.length>1||G.coup[u.anchor].some(b=>b!==u.anchor&&inComp.has(b));
      });
      if(it.units.length>1){
        const grpC=mean(it.units.map(u=>cur[u.anchor]));
        it.units.forEach(u=>{u.w=(u.partnered||u.pull)?worldW(u):0;});
        const singles=it.units.filter(u=>!u.partnered&&!u.pull);
        const Pp=it.units.filter(u=>u.partnered||u.pull);
        const L=Pp.filter(u=>u.pull<0).sort((a,b)=>b.w-a.w||cur[a.anchor]-cur[b.anchor]);
        const R=Pp.filter(u=>u.pull>0).sort((a,b)=>a.w-b.w||cur[a.anchor]-cur[b.anchor]);
        Pp.filter(u=>!u.pull).sort((a,b)=>b.w-a.w||cur[a.anchor]-cur[b.anchor]).forEach(u=>{
          const side=L.length<R.length?-1:R.length<L.length?1:(cur[u.anchor]<grpC?-1:1);
          if(side<0)L.push(u);else R.unshift(u);
        });
        it.units=L.concat(singles,R);
      }
    });
    list.forEach(it=>{
      it.units.forEach((u,ui)=>{
        if(u.mem.length===1||!u.anchor)return;
        let forced=0;
        if(u.want)forced=-u.want;
        else if(it.units.length>1&&ui===0)forced=-1;
        else if(it.units.length>1&&ui===it.units.length-1)forced=1;
        else if(u.pull)forced=u.pull;
        const side={},depth={};side[u.anchor]=0;depth[u.anchor]=0;
        // direct partners: the first (primary) one takes the outer side; a second
        // partner goes on the other side so each set of half-siblings sits under its couple
        const cr=y=>{const cc=G.coupConns[u.anchor];for(let i=0;i<cc.length;i++)if(cc[i].from===y||cc[i].to===y)return i;return 99;};
        const direct=linked[u.anchor].slice().sort((a,b)=>cr(a)-cr(b));
        const first=forced||(direct.length?(cur[direct[0]]<cur[u.anchor]?-1:1):1);
        direct.forEach((y,k)=>{depth[y]=1;side[y]=k%2===0?first:-first;});
        const q=direct.slice();
        while(q.length){
          const x=q.shift();
          linked[x].forEach(y=>{
            if(side[y]!==undefined)return;
            depth[y]=depth[x]+1;side[y]=side[x];
            q.push(y);
          });
        }
        u.mem.forEach(m=>{if(side[m]===undefined){side[m]=1;depth[m]=9;}});
        const left=u.mem.filter(m=>side[m]<0).sort((a,b)=>depth[b]-depth[a]||cur[a]-cur[b]);
        const right=u.mem.filter(m=>side[m]>0).sort((a,b)=>depth[a]-depth[b]||cur[a]-cur[b]);
        u.order=left.concat([u.anchor],right);
      });
    });
  };
  const reorder=(row,keyFn)=>{
    row.list.forEach((it,i)=>{const k=keyFn(it);it.key=k===null?it.px:k;it.ord=i;});
    row.list.sort((a,b)=>a.key-b.key||a.ord-b.ord);pack(row);
  };
  const kidsKey=it=>{
    if(it.real)return null;
    const ks=[];it.units.forEach(u=>u.mem.forEach(m=>G.ch[m].forEach(k=>{if(has(k)&&gen[k]>gen[m])ks.push(ppx[k]);})));
    return ks.length?mean(ks):null;
  };
  const parKeyFn=it=>{
    if(!it.real)return null;
    const pa=it.units.map(u=>u.anchor).find(hasPar);if(!pa)return null;
    const ps=G.par[pa].filter(has);
    return ps.length?mean(ps.map(p=>ppx[p])):null;
  };
  rows.forEach(pack);
  rows.forEach(r=>{arrange(r);pack(r);});
  for(let pass=0;pass<5;pass++){
    for(let r=rows.length-2;r>=0;r--)reorder(rows[r],kidsKey);
    for(let r=1;r<rows.length;r++)reorder(rows[r],parKeyFn);
    rows.forEach(r=>{arrange(r);pack(r);});
  }
  for(let r=1;r<rows.length;r++)reorder(rows[r],parKeyFn);

  rows.forEach((row,ri)=>{
    const {list}=row;
    const seq=[];list.forEach(it=>it.units.forEach(u=>{u.grp=it.k;seq.push(u);}));
    const sep=[];
    seq.forEach((u,i)=>{
      const k=u.order.length;u.w=(k-1)*COUPLE_SLOT+CARD_W;u.i=i;
      u.order.forEach((m,j)=>{off[m]=(j-(k-1)/2)*COUPLE_SLOT;unitOf[m]=u;});
      if(i>0){const p=seq[i-1];sep.push((p.w+u.w)/2+(p.grp===u.grp?SIB_GAP:FAM_GAP));}
    });
    // initial positions: packed
    let x=0;seq.forEach((u,i)=>{if(i>0)x+=sep[i-1];u.x=x;});
    const cum=[0];for(let i=1;i<seq.length;i++)cum.push(cum[i-1]+sep[i-1]);
    Object.assign(row,{units:seq,sep,cum});
  });

  /* ── 2. one variable per person, in the frozen row order ──
     energy (quadratic → unique optimum):
     • family term   (w=1):  centre of the children's span − midpoint of their parents
     • springs       (small): gap between neighbours − minimum gap; strongest inside a
                              couple, so partners only separate when their kids need room
                              (e.g. two sets of half-siblings), weakest between families.
     constraints: the order and the minimum gaps of every row. */
  const cells=[],cellOf={};
  rows.forEach((row,ri)=>{
    row.cells=[];
    row.units.forEach(u=>u.order.forEach(m=>{
      const c={id:m,row:ri,unit:u,grp:u.grp,x:u.x+off[m],i:row.cells.length,idx:cells.length};
      row.cells.push(c);cells.push(c);cellOf[m]=c;
    }));
    row.csep=[];row.ckind=[];
    for(let i=1;i<row.cells.length;i++){
      const a=row.cells[i-1],b=row.cells[i];
      const k=a.unit===b.unit?0:(a.grp===b.grp?1:2);
      row.ckind.push(k);row.csep.push(k===0?COUPLE_SLOT:CARD_W+(k===1?SIB_GAP:FAM_GAP));
    }
  });
  const n=cells.length;
  const terms=[];
  const addTerm=(w,pairs,c0,c)=>{
    const m=new Map();pairs.forEach(([i,a])=>m.set(i,(m.get(i)||0)+a));
    const idx=[],a=[];m.forEach((v,k)=>{if(Math.abs(v)>1e-12){idx.push(k);a.push(v);}});
    if(idx.length)terms.push({w,idx,a,c0,c:!!c});
  };
  rows.forEach(row=>{
    const groups={};
    row.units.forEach(u=>{if(u.anchor&&u.grp.indexOf('g:')===0)(groups[u.grp]=groups[u.grp]||[]).push(u);});
    Object.values(groups).forEach(gu=>{
      const pa=gu.map(u=>u.anchor).find(hasPar);if(!pa)return;
      const ps=G.par[pa].filter(p=>cellOf[p]);
      if(!ps.length)return;
      const F=cellOf[gu[0].anchor],L=cellOf[gu[gu.length-1].anchor];
      const kp=p=>cellOf[p].row*1e6+cellOf[p].i;
      const sp=ps.slice().sort((a,b)=>kp(a)-kp(b));
      const pL=cellOf[sp[0]],pR=cellOf[sp[sp.length-1]];
      addTerm(1,[[F.idx,.5],[L.idx,.5],[pL.idx,-.5],[pR.idx,-.5]],0);
    });
    for(let i=1;i<row.cells.length;i++){
      const a=row.cells[i-1],b=row.cells[i],k=row.ckind[i-1];
      if(k===0){
        // couples stay together; only partners of someone with several partners may
        // open up (half-siblings), and that spring is never relaxed in the polish pass
        const multi=G.coup[a.id].length>1||G.coup[b.id].length>1;
        addTerm(multi?0.008:0.6,[[b.idx,1],[a.idx,-1]],-row.csep[i-1],false);
      } else addTerm(k===1?0.08:0.02,[[b.idx,1],[a.idx,-1]],-row.csep[i-1],true);
    }
  });
  // cross-family couples: a gentle pull so the two families sit side by side
  VCONNS.forEach(c=>{
    if(c.type!=='pareja')return;
    const a=cellOf[c.from],b=cellOf[c.to];
    if(!a||!b||a.row!==b.row||a.unit===b.unit)return;
    const [l,r]=a.i<b.i?[a,b]:[b,a];
    const between=r.i-l.i-1;   // people standing between them: strong pull only when they can actually meet
    addTerm(1.5/Math.pow(1+between,2),[[r.idx,1],[l.idx,-1]],-(CARD_W+FAM_GAP),true);
  });

  /* ── 3. accelerated projected gradient (FISTA on a diagonal majoriser) ──
     every step minimises a separable upper bound; per row that is exactly a
     weighted isotonic regression (PAVA), so order and gaps always hold. */
  const proj=(z,D)=>{rows.forEach(row=>{const ids=row.cells.map(c=>c.idx);const sol=pavaSolve(ids.map(i=>z[i]),ids.map(i=>D[i]),row.csep);ids.forEach((i,k)=>{z[i]=sol[k];});});};
  const run=(x0,lam,maxIt)=>{
    const W=terms.map(T=>T.c?T.w*lam:T.w);
    const D=new Float64Array(n).fill(1e-3);
    terms.forEach((T,ti)=>{let s=0;T.a.forEach(v=>{s+=Math.abs(v);});T.idx.forEach((i,j)=>{D[i]+=2*W[ti]*Math.abs(T.a[j])*s;});});
    const energy=y=>{let e=0;terms.forEach((T,ti)=>{let s=T.c0;for(let j=0;j<T.idx.length;j++)s+=T.a[j]*y[T.idx[j]];e+=W[ti]*s*s;});return e;};
    const grad=(y,g)=>{g.fill(0);terms.forEach((T,ti)=>{let s=T.c0;for(let j=0;j<T.idx.length;j++)s+=T.a[j]*y[T.idx[j]];const f=2*W[ti]*s;for(let j=0;j<T.idx.length;j++)g[T.idx[j]]+=f*T.a[j];});};
    let x=Float64Array.from(x0);proj(x,D);
    let xPrev=Float64Array.from(x),tk=1,E=energy(x),calm=0;
    const y=new Float64Array(n),g=new Float64Array(n);
    for(let it=0;it<maxIt;it++){
      const tn=(1+Math.sqrt(1+4*tk*tk))/2,beta=(tk-1)/tn;
      for(let i=0;i<n;i++)y[i]=x[i]+beta*(x[i]-xPrev[i]);
      grad(y,g);
      let xn=new Float64Array(n);for(let i=0;i<n;i++)xn[i]=y[i]-g[i]/D[i];
      proj(xn,D);
      let En=energy(xn);
      if(En>E){tk=1;grad(x,g);xn=new Float64Array(n);for(let i=0;i<n;i++)xn[i]=x[i]-g[i]/D[i];proj(xn,D);En=energy(xn);}
      else tk=tn;
      let mv=0;for(let i=0;i<n;i++)mv=Math.max(mv,Math.abs(xn[i]-x[i]));
      xPrev=x;x=xn;E=En;
      calm=mv<0.004?calm+1:0;
      if(calm>40||E<1e-6)break;
    }
    return x;
  };
  let x=new Float64Array(n);cells.forEach((c,i)=>{x[i]=c.x;});
  x=run(x,1,8000);      // compact and well-conditioned
  x=run(x,0.01,4000);   // polish: exact centring wherever the order allows it
  x=run(x,0.0005,3000);
  const res={};cells.forEach((c,i)=>{res[c.id]=x[i]-CARD_W/2;});
  return res;
}

let _layoutAnim=null;
function animateTo(pos,done){
  const ids=Object.keys(pos);
  const from={};ids.forEach(id=>{from[id]={x:S.people[id].x||0,y:S.people[id].y||0};});
  const t0=performance.now(),D=matchMedia('(prefers-reduced-motion: reduce)').matches?0:460;
  if(_layoutAnim)cancelAnimationFrame(_layoutAnim);
  (function step(now){
    const k=D?Math.min(1,(now-t0)/D):1;const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    ids.forEach(id=>{const p=S.people[id];if(!p)return;p.x=from[id].x+(pos[id].x-from[id].x)*e;p.y=from[id].y+(pos[id].y-from[id].y)*e;moveCardEl(id);});
    renderConns();
    if(k<1)_layoutAnim=requestAnimationFrame(step);
    else{_layoutAnim=null;ids.forEach(id=>{if(S.people[id]){S.people[id].x=pos[id].x;S.people[id].y=pos[id].y;moveCardEl(id);}});done&&done();}
  })(t0);
}
function autoLayout(msg){
  if(!Object.keys(S.people).length)return;
  msg=typeof msg==='string'?msg:t('organized');
  const pos=computeLayout();
  renderAll();  // refresh IDs on cards
  animateTo(pos,()=>{
    // drop stored rigid-couple offsets: the new layout defines them
    Object.keys(S).forEach(k=>{if(k.indexOf('_roff_')===0)delete S[k];});
    renderConns();persist();
    toast(msg,{action:t('undo'),fn:undo});
  });
}

function marqueeHits(){
  const mx=Math.min(S.marquee.x0,S.marquee.x1),my=Math.min(S.marquee.y0,S.marquee.y1);
  const mw=Math.abs(S.marquee.x1-S.marquee.x0),mh=Math.abs(S.marquee.y1-S.marquee.y0);
  const cx0=(mx-S.panX)/S.zoom,cy0=(my-S.panY)/S.zoom,cx1=(mx+mw-S.panX)/S.zoom,cy1=(my+mh-S.panY)/S.zoom;
  const hits=new Set();
  for(const id of visIds()){const p=S.people[id],sz=cardSize(id);if(p.x+sz.w>cx0&&p.x<cx1&&p.y+sz.h>cy0&&p.y<cy1)hits.add(id);}
  return {hits,mx,my,mw,mh};
}

/* ════════════════════════════════════════════════════════════════
   TOUCH
   ════════════════════════════════════════════════════════════════ */
(function(){
  const T={lastTap:0,lastTapId:null,tapTimer:null,panning:false,panStart:null,pinching:false,pinchDist:0,dragging:false};
  const rel=(cx,cy)=>{const r=cwEl.getBoundingClientRect();return{x:cx-r.left,y:cy-r.top};};
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const mid=(a,b)=>({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});

  cwEl.addEventListener('touchstart',e=>{
    const touches=e.touches;
    if(touches.length===2){
      e.preventDefault();T.panning=false;
      if(S.draggingCard){S.draggingCard=null;}
      T.pinching=true;T.pinchDist=dist(touches[0],touches[1]);
      const m=mid(touches[0],touches[1]);T.pinchMid=rel(m.x,m.y);T.panAtPinch={x:S.panX,y:S.panY};T.zoomAtPinch=S.zoom;return;
    }
    if(touches.length!==1)return;
    const tt=touches[0];
    const target=document.elementFromPoint(tt.clientX,tt.clientY);
    if(target&&target.closest('#empty button'))return;
    e.preventDefault();
    const ft=target&&target.closest&&target.closest('.famtog');
    if(ft){collapseFamily(ft.dataset.fam);return;}
    const portEl=target&&target.closest('.port');
    if(portEl){startWire(portEl.dataset.id,portEl.dataset.port,tt.clientX,tt.clientY);return;}
    const tool=target&&target.closest('.ctool');
    if(tool){const id=tool.closest('.card').dataset.id;if(tool.dataset.tool==='collapse')toggleCollapse(id);else toggleSecondary(id);return;}
    const ctaEl=target&&target.closest('.cta');
    if(ctaEl){
      const id2=ctaEl.closest('.card').dataset.id,a=ctaEl.dataset.action;
      if(a==='expand')expandFamily(REPS[id2]);else if(a==='edit')openEditPanel(id2);else if(a==='del')askDelete(id2);else openDetailPanel(id2);
      return;
    }
    clearTimeout(T.lp);closeCtx();T.lpOrigin={x:tt.clientX,y:tt.clientY};
    T.lp=setTimeout(()=>{
      if(S.didDrag||T.panMoved||T.pinching)return;
      clearTimeout(T.tapTimer);T.lastTap=0;S.draggingCard=null;T.panning=false;
      openCtx(tt.clientX,tt.clientY,target);
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
    },520);
    const cardEl=target&&target.closest('.card');
    if(cardEl){
      const id=cardEl.dataset.id;if(!S.people[id])return;
      const now=Date.now();
      if(now-T.lastTap<300&&T.lastTapId===id){clearTimeout(T.tapTimer);if(REPS[id])expandFamily(REPS[id]);else openEditPanel(id);T.lastTap=0;return;}
      T.lastTap=now;T.lastTapId=id;
      startCardDrag(id,tt.clientX,tt.clientY);
      T.tapTimer=setTimeout(()=>{if(!S.didDrag&&!S.draggingCard){selectCard(id);if(!REPS[id])openDetailPanel(id);}},300);
      return;
    }
    const now2=Date.now();
    if(now2-T.lastTap<300&&!T.lastTapId){
      clearTimeout(T.tapTimer);
      const r=cwEl.getBoundingClientRect();
      S._newNodeX=(tt.clientX-r.left-S.panX)/S.zoom-CARD_W/2;S._newNodeY=(tt.clientY-r.top-S.panY)/S.zoom-50;
      S._quickRel=null;openAddPanel();T.lastTap=0;return;
    }
    T.lastTap=now2;T.lastTapId=null;
    T.hitCi=(target&&target.dataset&&target.dataset.ci!==undefined)?+target.dataset.ci:null;
    T.panning=true;T.panMoved=false;T.panStart={x:tt.clientX-S.panX,y:tt.clientY-S.panY};T.panOrigin={x:tt.clientX,y:tt.clientY};
  },{passive:false});

  cwEl.addEventListener('touchmove',e=>{
    const touches=e.touches;e.preventDefault();
    if(T.lp&&touches.length===1&&T.lpOrigin&&Math.hypot(touches[0].clientX-T.lpOrigin.x,touches[0].clientY-T.lpOrigin.y)>8){clearTimeout(T.lp);T.lp=null;}
    if(touches.length===2){clearTimeout(T.lp);T.lp=null;}
    if(touches.length===2&&T.pinching){
      const d=dist(touches[0],touches[1]);
      const nz=Math.max(ZMIN,Math.min(ZMAX,T.zoomAtPinch*(d/T.pinchDist)));
      const m=mid(touches[0],touches[1]);const rr=rel(m.x,m.y);
      S.panX=rr.x-(T.pinchMid.x-T.panAtPinch.x)*(nz/T.zoomAtPinch);
      S.panY=rr.y-(T.pinchMid.y-T.panAtPinch.y)*(nz/T.zoomAtPinch);
      S.zoom=nz;applyTransform();return;
    }
    if(touches.length!==1)return;
    const tt=touches[0];
    if(S.wiringFrom){moveWire(tt.clientX,tt.clientY);return;}
    if(S.draggingCard){if(dragCardTo(tt.clientX,tt.clientY))clearTimeout(T.tapTimer);return;}
    if(T.panning){
      if(Math.hypot(tt.clientX-T.panOrigin.x,tt.clientY-T.panOrigin.y)>6){T.panMoved=true;T.lastTap=0;}
      S.panX=tt.clientX-T.panStart.x;S.panY=tt.clientY-T.panStart.y;applyTransform();
    }
  },{passive:false});

  cwEl.addEventListener('touchend',e=>{
    e.preventDefault();clearTimeout(T.lp);T.lp=null;
    if(S.wiringFrom){endWire(null);return;}
    if(S.draggingCard){const moved=S.didDrag;S.draggingCard=null;S.dragOffset=null;if(moved){renderConns();persist();}}
    if(T.panning&&!T.panMoved&&e.touches.length===0&&T.hitCi!==null&&T.hitCi!==undefined){
      const ci=T.hitCi;T.hitCi=null;T.panning=false;T.lastTap=0;onConnClickIdx(ci);return;
    }
    if(T.panning&&!T.panMoved&&e.touches.length===0&&!T.lastTapId){
      // single tap on empty canvas: clear selection (after the double-tap window)
      clearTimeout(T.tapTimer);T.tapTimer=setTimeout(()=>{if(T.lastTap){clearSelection();closePanel();}},310);
    }
    if(e.touches.length<2)T.pinching=false;
    if(e.touches.length===0)T.panning=false;
  },{passive:false});
})();

document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='Escape'){
    if(document.activeElement===document.getElementById('search')){closeSearch();return;}
    document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));
    S.deletingId=null;S.deletingConn=null;S._bulkDeleteIds=null;S.relFrom=null;S.relTo=null;S.actionConnIdx=null;
    closeMenus();closeCtx();closePanel();
    if(S.marquee){document.getElementById('marquee').style.display='none';cwEl.classList.remove('marquee-mode');S.marquee=null;}
    clearSelection();
    return;
  }
  if(document.querySelector('.overlay.open')){if(e.key==='Enter'&&tag!=='TEXTAREA'){e.preventDefault();const ov=document.querySelector('.overlay.open .primary-btn');if(ov)ov.click();}return;}
  if(typing)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!e.shiftKey){undo();e.preventDefault();return;}
  if(mod&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){redo();e.preventDefault();return;}
  if(mod&&e.key.toLowerCase()==='c'&&!e.shiftKey){copyTree();e.preventDefault();return;}
  if(mod&&e.key.toLowerCase()==='v'){pasteTree();e.preventDefault();return;}
  if(mod&&e.key.toLowerCase()==='a'){S.selectedIds=new Set(visIds());S.selectedId=[...S.selectedIds][0]||null;for(const el of CARDS.values())el.classList.add('selected');e.preventDefault();return;}
  if(mod&&e.key.toLowerCase()==='f'){openSearch();e.preventDefault();return;}
  if(e.key==='/'){openSearch();e.preventDefault();return;}
  if(mod)return;
  if(e.key==='Delete'||e.key==='Backspace'){
    const delIds=[...S.selectedIds].filter(id=>!REPS[id]);
    if(S.selectedIds.size&&!delIds.length){toast(t('famNoDelete'));e.preventDefault();return;}
    if(delIds.length>1)askDeleteMultiple(delIds);
    else if(delIds.length===1){if(S.people[delIds[0]])askDelete(delIds[0]);}
    else if(S.selectedId&&S.people[S.selectedId]&&!REPS[S.selectedId])askDelete(S.selectedId);
    e.preventDefault();return;
  }
  if(e.key==='f'||e.key==='F'){fitScreen();return;}
  if(e.key==='n'||e.key==='N'){S._quickRel=null;S._newNodeX=undefined;openAddPanel();e.preventDefault();return;}
  if(e.key==='e'||e.key==='E'){if(S.selectedId)openEditPanel(S.selectedId);return;}
  if(e.key===' '&&!e.repeat){document.body.classList.add('space-pan');e.preventDefault();}
});
document.addEventListener('keyup',e=>{if(e.key===' ')document.body.classList.remove('space-pan');});

      items.push({label:t('selectAll'),icon:'check',fn:()=>{S.selectedIds=new Set(visIds());S.selectedId=[...S.selectedIds][0];for(const el of CARDS.values())el.classList.add('selected');},kbd:'Ctrl A'});
    }
  }
  ctxActions=[];
  ctxEl.innerHTML=items.map(it=>{
    if(it==='sep')return '<div class="menu-sep"></div>';
    if(it.head)return '<div class="menu-label">'+esc(it.head)+'</div>';
    ctxActions.push(it.fn);
    return '<button class="menu-item'+(it.danger?' danger':'')+'" data-ctx="'+(ctxActions.length-1)+'">'+
      (it.dot?'<span class="gdot" style="background:'+it.dot+'"></span>':ic(it.icon))+'<span>'+esc(it.label)+'</span>'+
      (it.kbd?'<span class="kbd">'+it.kbd+'</span>':'')+'</button>';
  }).join('');
  ctxEl.classList.add('open');
  const w=ctxEl.offsetWidth,h=ctxEl.offsetHeight;
  ctxEl.style.left=Math.max(8,Math.min(clientX,window.innerWidth-w-8))+'px';
  ctxEl.style.top=Math.max(8,Math.min(clientY,window.innerHeight-h-8))+'px';
}
ctxEl.addEventListener('click',e=>{const b=e.target.closest('[data-ctx]');if(!b)return;closeCtx();ctxActions[+b.dataset.ctx]();});
cwEl.addEventListener('contextmenu',e=>{e.preventDefault();if(e.target.closest('button')&&!e.target.closest('.card'))return;openCtx(e.clientX,e.clientY,e.target);});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#ctx-menu'))closeCtx();},true);
window.addEventListener('blur',closeCtx);

const searchEl=document.getElementById('search'),srEl=document.getElementById('search-results');
let srActive=0,srList=[];
function openSearch(){document.body.classList.add('search-open');searchEl.focus();searchEl.select();runSearch();}
function closeSearch(){srEl.classList.remove('open');document.body.classList.remove('search-open');searchEl.blur();}
function runSearch(){
  const q=norm(searchEl.value.trim());
  if(!q){srEl.classList.remove('open');srList=[];return;}
  const words=q.split(/\s+/);
  srList=Object.keys(S.people).filter(id=>{const p=S.people[id];const h=norm(fullName(p)+' '+(p.birthplace||'')+' '+(p.birth||''));return words.every(w=>h.indexOf(w)>=0);})
    .sort((a,b)=>fullName(S.people[a]).localeCompare(fullName(S.people[b]))).slice(0,12);
  srActive=0;
  srEl.innerHTML=srList.length?srList.map((id,i)=>{const p=S.people[id];return '<button class="sr-item'+(i===0?' active':'')+'" data-id="'+id+'"><div class="mav g-'+gc(p.gender)+'">'+avatarHTML(p)+'</div><div><div>'+esc(fullName(p))+'</div><div class="sr-sub">'+esc([yearsOf(p),p.birthplace].filter(Boolean).join(' · ')||(S.showIds&&S._dbgGen[id]!==undefined?'ID '+S._dbgGen[id]:''))+'</div></div></button>';}).join('')
    :'<div class="sr-empty">'+t('noResults')+'</div>';
  srEl.classList.add('open');
}
function pickSearch(id){closeSearch();searchEl.value='';revealAndFocus(id,true);}
searchEl.addEventListener('input',runSearch);
searchEl.addEventListener('focus',()=>{if(searchEl.value)runSearch();});
searchEl.addEventListener('blur',()=>setTimeout(()=>{srEl.classList.remove('open');if(!searchEl.value)document.body.classList.remove('search-open');},150));
searchEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!srList.length)return;srActive=(srActive+(e.key==='ArrowDown'?1:-1)+srList.length)%srList.length;
    srEl.querySelectorAll('.sr-item').forEach((b,i)=>b.classList.toggle('active',i===srActive));}
  else if(e.key==='Enter'){e.preventDefault();if(srList[srActive])pickSearch(srList[srActive]);}
});
srEl.addEventListener('mousedown',e=>{const b=e.target.closest('.sr-item');if(b){e.preventDefault();pickSearch(b.dataset.id);}});

function closeMenus(){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));}
function toggleMenu(id,e){
  e&&e.stopPropagation();const m=document.getElementById(id);const was=m.classList.contains('open');closeMenus();if(was)return;
  if(id==='settings-menu'){const r=document.getElementById('btn-style').getBoundingClientRect();m.style.left=Math.min(r.left,window.innerWidth-250)+'px';m.style.top=(r.bottom+8)+'px';}
  m.classList.add('open');syncSettingsUI();
}
document.addEventListener('click',e=>{if(!e.target.closest('.drop')&&!e.target.closest('.menu'))closeMenus();});
function setTheme(name){
  S._theme=name==='light'?'light':'dark';
  document.body.classList.toggle('theme-light',S._theme==='light');
  document.querySelector('meta[name=theme-color]').setAttribute('content',S._theme==='light'?'#fbfbfc':'#0f1116');
  try{localStorage.setItem('gt_theme',S._theme);}catch(e){}
  syncSettingsUI();const st=document.getElementById('set-theme');if(st)st.value=S._theme;
}
function setConnStyle(style){S._connStyle=style;try{localStorage.setItem('gt_connstyle',style);}catch(e){}renderConns();syncSettingsUI();}
function setPref(k,v){S[k]=v;try{localStorage.setItem('gt_'+k,v?'1':'0');}catch(e){}if(k==='showIds'){renderAll();if(S.panelMode==='detail'&&S.selectedId)openDetailPanel(S.selectedId);}applyPrefs();}
function applyPrefs(){
  document.body.classList.toggle('no-labels',!S.showLabels);
  document.getElementById('legend').style.display=S.showLegend?'':'none';
  renderConns();syncSettingsUI();
}
function syncSettingsUI(){
  document.querySelectorAll('#settings-menu [data-set]').forEach(b=>{
    const [k,v]=b.dataset.set.split(':');
    let on=false;
    if(k==='theme')on=S._theme===v;else if(k==='conn')on=(S._connStyle||'ortho')===v;
    else if(k==='boxes')on=S.showBoxes;else if(k==='ids')on=S.showIds;else if(k==='labels')on=S.showLabels;else if(k==='legend')on=S.showLegend;
    b.classList.toggle('on',on);
  });
}
document.getElementById('settings-menu').addEventListener('click',e=>{
  const b=e.target.closest('[data-set]');if(!b)return;e.stopPropagation();
  const [k,v]=b.dataset.set.split(':');
  if(k==='theme')setTheme(v);else if(k==='conn')setConnStyle(v);
  else if(k==='boxes')setPref('showBoxes',!S.showBoxes);else if(k==='ids')setPref('showIds',!S.showIds);else if(k==='labels')setPref('showLabels',!S.showLabels);else if(k==='legend')setPref('showLegend',!S.showLegend);
});
