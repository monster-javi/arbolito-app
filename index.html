<!DOCTYPE html>
<!-- Arbolito App v3.3 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arbolito App">
<meta name="theme-color" content="#0f1116">
<title>Arbolito App</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1116'/%3E%3Cpath d='M32 14v14M18 40v-6h28v6M32 28v6' stroke='%239ba2b0' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='14' r='6' fill='%233ecf6a'/%3E%3Ccircle cx='18' cy='46' r='6' fill='%235b97ff'/%3E%3Ccircle cx='46' cy='46' r='6' fill='%23f472b6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS (mismo lenguaje que Gastos App / Task App) ═══════════ */
:root{
  --bg:#0f1116; --side:#12141a; --surface:#161921; --surface-2:#1d212b; --surface-3:#262b37;
  --card:#171a22; --card-head:#1b1f29;
  --border:rgba(255,255,255,0.075); --border-strong:rgba(255,255,255,0.13);
  --text:#eceef3; --text-dim:#9ba2b0; --text-faint:#646c7a;
  --accent:#3ecf6a; --accent-ink:#06210f; --accent-soft:rgba(62,207,106,0.12); --accent-line:rgba(62,207,106,0.5);
  --amber:#f2ab43; --blue:#5b97ff; --danger:#f25f55; --danger-soft:rgba(242,95,85,0.12);
  --male:#5b97ff; --female:#f472b6; --neutral:#a78bfa;
  --c-padre:rgba(236,238,243,0.30); --c-pareja:#f2ab43; --c-hermano:#5b97ff;
  --grid-dot:rgba(255,255,255,0.055);
  --glass:rgba(22,25,33,0.82);
  --shadow-card:0 1px 0 rgba(255,255,255,0.03) inset, 0 6px 18px -6px rgba(0,0,0,0.55);
  --shadow-pop:0 20px 50px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
  --font:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --card-w:188px;
}
body.theme-light{
  --bg:#f3f4f7; --side:#fbfbfc; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e6e9ef;
  --card:#ffffff; --card-head:#ffffff;
  --border:rgba(15,17,22,0.09); --border-strong:rgba(15,17,22,0.16);
  --text:#14161c; --text-dim:#545b68; --text-faint:#959cab;
  --accent:#1e9e50; --accent-ink:#ffffff; --accent-soft:rgba(30,158,80,0.10); --accent-line:rgba(30,158,80,0.45);
  --amber:#d48a17; --blue:#2f6fe0; --danger:#d9443a; --danger-soft:rgba(217,68,58,0.10);
  --male:#2f6fe0; --female:#d6408f; --neutral:#7c5ce6;
  --c-padre:rgba(20,22,28,0.32); --c-pareja:#d48a17; --c-hermano:#2f6fe0;
  --grid-dot:rgba(15,17,22,0.09);
  --glass:rgba(255,255,255,0.86);
  --shadow-card:0 1px 2px rgba(15,17,22,0.06), 0 8px 20px -10px rgba(15,17,22,0.22);
  --shadow-pop:0 20px 50px -14px rgba(15,17,22,0.35), 0 0 0 1px rgba(15,17,22,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--font);font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);
  height:100vh;height:100dvh;display:flex;flex-direction:column;font-size:14px;}
button,input,select,textarea{font-family:inherit;}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px;}
body.no-select,body.no-select *{user-select:none!important;-webkit-user-select:none!important;}
svg.i{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid var(--surface);}

/* ═══════════ TOPBAR ═══════════ */
.topbar{display:flex;align-items:center;gap:8px;height:56px;flex-shrink:0;padding:0 16px;padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--border);background:var(--side);z-index:30;position:relative;}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-0.01em;white-space:nowrap;padding-right:6px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 12px rgba(62,207,106,.45);flex-shrink:0;}
.brand-ver{font-size:11px;color:var(--text-faint);font-weight:500;margin-left:2px;}
.search-wrap{position:relative;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;height:32px;padding:0 11px;flex:1;min-width:130px;max-width:300px;margin-left:8px;transition:border-color .12s;color:var(--text-faint);}
.search-wrap:focus-within{border-color:var(--accent-line);}
.search-wrap input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-kbd{font-size:10.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-family:var(--mono);}
.search-results{position:absolute;top:38px;left:0;right:0;min-width:260px;background:var(--surface-2);border-radius:12px;box-shadow:var(--shadow-pop);
  padding:6px;display:none;z-index:80;max-height:360px;overflow-y:auto;}
.search-results.open{display:block;}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;background:none;border:none;color:var(--text);cursor:pointer;text-align:left;font-size:13.5px;}
.sr-item:hover,.sr-item.active{background:var(--surface-3);}
.sr-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.sr-empty{padding:12px;text-align:center;color:var(--text-faint);font-size:13px;}
.topbar-spacer{flex:1;}
.counter{font-size:12.5px;height:32px;padding:0 11px;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  display:flex;gap:5px;align-items:center;white-space:nowrap;flex-shrink:0;}
.counter b{color:var(--text);font-weight:700;}
.iconbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);
  border-radius:9px;height:32px;padding:0 11px;cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s,background .12s;flex-shrink:0;}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong);}
.iconbtn:disabled{opacity:.4;cursor:default;}
.iconbtn:disabled:hover{color:var(--text-dim);border-color:var(--border);}
.iconbtn--active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
.icon-only{padding:0;width:32px;justify-content:center;}
.primary-btn{display:flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;height:32px;padding:0 14px;
  font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:filter .12s;}
.primary-btn:hover{filter:brightness(1.08);}
.lang-select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--border);border-radius:9px;height:32px;padding:0 10px;width:66px;text-align:center;
  color:var(--text-dim);font-size:12.5px;cursor:pointer;flex-shrink:0;}
.only-mobile{display:none!important;}

/* dropdown menus */
.drop{position:relative;display:inline-flex;}
.menu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:230px;background:var(--surface-2);border-radius:12px;box-shadow:var(--shadow-pop);
  padding:6px;z-index:90;}
.menu.open{display:block;animation:dropIn .14s ease;}
.menu--left{right:auto;left:0;}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.menu-label{font-size:11px;color:var(--text-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 9px 4px;}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border:none;background:transparent;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--text-dim);}
.menu-item:hover{background:var(--surface-3);color:var(--text);}
.menu-item .check{margin-left:auto;color:var(--accent);opacity:0;}
.menu-item.on .check{opacity:1;}
.menu-item.on{color:var(--text);}
.menu-sep{height:1px;background:var(--border);margin:5px 4px;}
.ctx-menu{position:fixed;z-index:300;min-width:220px;background:var(--surface-2);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:none;animation:dropIn .12s ease;}
.ctx-menu.open{display:block;}
.ctx-menu .menu-item .gdot{width:9px;height:9px;border-radius:50%;margin:0 3px;flex-shrink:0;}
.ctx-menu .menu-item.danger{color:var(--danger);}
.ctx-menu .menu-item.danger:hover{background:var(--danger-soft);}
.ctx-menu .menu-item .kbd{margin-left:auto;}
.ctx-menu .menu-label{text-transform:none;letter-spacing:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.sw{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid var(--border-strong);}

/* ═══════════ WORKSPACE / CANVAS ═══════════ */
.workspace{display:flex;flex:1;overflow:hidden;position:relative;min-height:0;}
.stage{flex:1;position:relative;overflow:hidden;min-width:0;}
#cw{position:absolute;inset:0;overflow:hidden;cursor:default;background:var(--bg);touch-action:none;}
#cw::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1.2px);background-size:var(--gs,24px) var(--gs,24px);
  background-position:var(--gx,0) var(--gy,0);}
#cw.panning,body.space-pan #cw{cursor:grabbing;}
#cw.marquee-mode{cursor:crosshair;}
#wire-svg{position:absolute;inset:0;pointer-events:none;overflow:visible;width:100%;height:100%;z-index:15;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;overflow:visible;will-change:transform;}
#conn-svg{position:absolute;top:0;left:0;width:1px;height:1px;pointer-events:none;overflow:visible;}
#conn-svg .ln{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
#conn-svg .ln-padre{stroke:var(--c-padre);}
#conn-svg .ln-pareja{stroke:var(--c-pareja);stroke-width:2;}
#conn-svg .ln-pareja.sec{stroke-width:1.5;stroke-dasharray:3 5;opacity:.75;}
#conn-svg .ln-hermano{stroke:var(--c-hermano);stroke-dasharray:5 4;opacity:.85;}
#conn-svg .ln-padre.dash{stroke-dasharray:4 4;}
#conn-svg .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer;}
#conn-svg .hit:hover + .ln, #conn-svg .ln.hl{stroke-width:3;}
#conn-svg .lbl{font-family:var(--font);font-size:10px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;letter-spacing:.02em;}
#conn-svg .lbl-padre{fill:var(--text-faint);}
#conn-svg .lbl-pareja{fill:var(--c-pareja);}
#conn-svg .lbl-hermano{fill:var(--c-hermano);}
#conn-svg .fbox{stroke-width:1.5;stroke-dasharray:7 5;pointer-events:none;}
body.no-labels #conn-svg .lbl{display:none;}
#canvas.lod-far #conn-svg .lbl{display:none;}

/* ═══════════ CARDS ═══════════ */
.card{position:absolute;width:var(--card-w);background:var(--card);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow-card);user-select:none;-webkit-user-select:none;--g:var(--neutral);transition:box-shadow .15s,border-color .15s;}
.card.g-male{--g:var(--male);} .card.g-female{--g:var(--female);} .card.g-neutral{--g:var(--neutral);}
.card:hover{border-color:color-mix(in srgb,var(--g) 45%,var(--border-strong));}
.sel-ring{display:none;position:absolute;inset:-4px;border-radius:15px;pointer-events:none;z-index:10;}
.card.selected .sel-ring{display:block;border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 22px rgba(62,207,106,.25);}
.card.in-selection .sel-ring{display:block;border:2px dashed var(--accent-line);}
.card.drop-target .sel-ring{display:block;border:2px solid var(--amber);box-shadow:0 0 0 4px rgba(242,171,67,.15);}
.card.flash .sel-ring{display:block;animation:flash 1.4s ease-out;border:2px solid var(--accent);}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent-line);}60%{box-shadow:0 0 0 18px rgba(62,207,106,0);}100%{box-shadow:none;}}

.card-head{position:relative;padding:10px 10px 9px 12px;border-radius:11px 11px 0 0;display:flex;align-items:center;gap:9px;cursor:grab;
  background:linear-gradient(90deg,color-mix(in srgb,var(--g) 15%,transparent),transparent 75%);}
.card-head::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--g);
  box-shadow:0 0 10px -1px var(--g);}
.card-head:active{cursor:grabbing;}
.card.collapsed .card-head{border-radius:11px;}
.avatar{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--g) 20%,var(--surface-2));display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--g) 55%,transparent);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.av-txt{color:var(--g);font-size:12px;font-weight:700;letter-spacing:.02em;}
.card-title{min-width:0;flex:1;}
.card-name{color:var(--text);font-size:13.5px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-0.005em;}
.card-sub{font-size:11px;color:var(--text-dim);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.card-tools{position:absolute;top:5px;right:5px;display:flex;gap:3px;z-index:6;}
.ctool{height:18px;min-width:18px;border-radius:6px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0 3px;font-size:10px;font-weight:700;gap:2px;opacity:.75;}
.ctool:hover{background:var(--surface-3);color:var(--text);opacity:1;}
.ctool svg.i{width:12px;height:12px;}
.ctool.couple{color:var(--c-pareja);opacity:1;}
.card-body{padding:0 12px 8px;display:flex;align-items:center;gap:8px;min-height:22px;}
.card-place{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;display:flex;align-items:center;gap:4px;}
.card-place svg.i{width:11px;height:11px;color:var(--text-faint);}
.card-id{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);
  border-radius:6px;padding:1px 6px;flex-shrink:0;}
.card-id b{color:var(--text-faint);font-weight:500;margin-right:3px;font-size:9.5px;letter-spacing:.04em;}
.card-btns{display:flex;border-top:1px solid var(--border);}
.cta{flex:1;height:30px;border:none;background:none;cursor:pointer;color:var(--text-faint);display:flex;align-items:center;justify-content:center;transition:color .12s,background .12s;}
.cta + .cta{border-left:1px solid var(--border);}
.cta:hover{color:var(--text);background:var(--surface-2);}
.cta[data-action="del"]:hover{color:var(--danger);background:var(--danger-soft);}
.cta:first-child{border-bottom-left-radius:11px;} .cta:last-child{border-bottom-right-radius:11px;}
.cta svg.i{width:14px;height:14px;pointer-events:none;}
.card.collapsed .card-body,.card.collapsed .card-btns{display:none;}

/* ports */
.ports{position:absolute;inset:0;pointer-events:none;}
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--card);cursor:crosshair;pointer-events:all;z-index:5;transition:transform .12s,background .12s;}
.port-t,.port-b{border:2px solid var(--accent);}
.port-l,.port-r{border:2px solid var(--amber);}
.port-t{top:-7px;left:50%;transform:translateX(-50%);}
.port-b{bottom:-7px;left:50%;transform:translateX(-50%);}
.port-l{left:-7px;top:50%;transform:translateY(-50%);}
.port-r{right:-7px;top:50%;transform:translateY(-50%);}
.port-t:hover,.port-b:hover{background:var(--accent);transform:translateX(-50%) scale(1.4);}
.port-l:hover,.port-r:hover{background:var(--amber);transform:translateY(-50%) scale(1.4);}
.port::after{content:attr(data-tip);position:absolute;background:var(--surface-3);color:var(--text);font-size:10px;font-weight:600;white-space:nowrap;padding:3px 7px;
  border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:var(--shadow-pop);}
.port-t::after{bottom:16px;left:50%;transform:translateX(-50%);}
.port-b::after{top:16px;left:50%;transform:translateX(-50%);}
.port-l::after{top:50%;right:16px;transform:translateY(-50%);}
.port-r::after{top:50%;left:16px;transform:translateY(-50%);}
.port:hover::after{opacity:1;}
body.wiring *{cursor:crosshair!important;}
body.wiring .port{opacity:0;pointer-events:none;}
body.wiring .card.wiring-source .port{opacity:1;pointer-events:auto;}
body.wiring-from-top .card:not(.wiring-source) .port[data-port="b"],
body.wiring-from-bottom .card:not(.wiring-source) .port[data-port="t"],
body.wiring-from-side .card:not(.wiring-source) .port[data-port="l"],
body.wiring-from-side .card:not(.wiring-source) .port[data-port="r"]{opacity:1;pointer-events:auto;}
body.wiring-from-top .card.drop-target .port[data-port="b"],
body.wiring-from-bottom .card.drop-target .port[data-port="t"],
body.wiring-from-side .card.drop-target .port[data-port="l"],
body.wiring-from-side .card.drop-target .port[data-port="r"]{background:var(--amber);border-color:var(--amber);}

/* zoomed out: simplify */
#canvas.lod-far .ports,#canvas.lod-far .card-btns,#canvas.lod-far .card-tools{display:none;}
#canvas.lod-far .card{box-shadow:none;}

/* collapsed family card */
.card.fam-card{--g:var(--accent);border:1.5px dashed var(--accent-line);
  box-shadow:5px 5px 0 -1px var(--card),5px 5px 0 0 var(--border-strong),10px 10px 0 -1px var(--card),10px 10px 0 0 var(--border),var(--shadow-card);}
.fam-card .avatar{color:var(--accent);}
.fam-card .avatar svg.i{width:18px;height:18px;}
.fam-faces{display:flex;padding:0 12px 10px 14px;min-height:22px;}
.fam-face{width:22px;height:22px;border-radius:50%;margin-right:-6px;border:2px solid var(--card);font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  --g:var(--neutral);background:color-mix(in srgb,var(--g) 25%,var(--surface-2));color:var(--g);}
.fam-face.g-male{--g:var(--male);} .fam-face.g-female{--g:var(--female);}
.fam-face.more{--g:var(--text-dim);}
.fam-sep{width:12px;flex-shrink:0;}
.fam-card .cta{gap:6px;font-size:12px;font-weight:600;color:var(--accent);border-radius:0 0 11px 11px;}
.fam-card .cta:hover{background:var(--accent-soft);color:var(--accent);}
#conn-svg .famtog{pointer-events:all;cursor:pointer;}
#conn-svg .famtog circle{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.2;}
#conn-svg .famtog:hover circle{stroke:var(--accent);fill:var(--accent-soft);}
#conn-svg .famtog path{stroke:var(--text-dim);stroke-width:1.7;fill:none;pointer-events:none;}
#conn-svg .famtog:hover path{stroke:var(--accent);}
#canvas.lod-far .famtog{display:none;}
#settings-menu{position:fixed;}

#marquee{display:none;position:absolute;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:4px;pointer-events:none;z-index:20;}

/* ═══════════ HUD ═══════════ */
.hud{position:absolute;inset:0;pointer-events:none;z-index:20;}
.hud > *{pointer-events:auto;}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 24px -10px rgba(0,0,0,.45);}
.toolbar{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:4px;padding:4px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;}
.toolbar::-webkit-scrollbar{display:none;}
.tbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text-dim);
  font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .12s,background .12s;flex-shrink:0;}
.tbtn:hover{color:var(--text);background:var(--surface-2);}
.tbtn:disabled{opacity:.35;cursor:default;background:none;color:var(--text-dim);}
.tbtn--accent{color:var(--accent);}
.tbtn--accent:hover{background:var(--accent-soft);color:var(--accent);}
.tsep{width:1px;height:20px;background:var(--border);margin:0 2px;flex-shrink:0;}
.zoom-ctl{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;align-items:center;padding:4px;gap:2px;}
.zoom-ctl .tbtn{width:34px;height:34px;padding:0;justify-content:center;}
.zoom-pct{font-size:10.5px;color:var(--text-faint);padding:2px 0;font-family:var(--mono);cursor:pointer;}
.legend{position:absolute;bottom:14px;left:14px;padding:10px 12px;font-size:11.5px;color:var(--text-dim);min-width:190px;}
.legend-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:600;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.legend-body{margin-top:8px;}
.legend.closed .legend-body{display:none;}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.leg-line{width:22px;height:0;border-top:2px solid;flex-shrink:0;}
.leg-dot{width:10px;height:10px;border-radius:50%;background:var(--card);flex-shrink:0;}
.legend-hint{color:var(--text-faint);font-size:11px;margin-bottom:3px;}
.legend-sep{height:1px;background:var(--border);margin:7px 0;}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border-strong);border-radius:4px;padding:0 4px;color:var(--text-dim);}

/* empty */
#empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:2;}
#empty .ei{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);}
#empty .ei svg.i{width:26px;height:26px;}
#empty h2{font-size:17px;font-weight:600;margin-bottom:6px;}
#empty p{color:var(--text-faint);font-size:13px;}
#empty button{pointer-events:auto;margin:16px auto 0;}

/* ═══════════ PANEL ═══════════ */
#panel{width:360px;background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.ph{height:52px;padding:0 10px 0 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border);
  font-size:14px;font-weight:600;}
.phx{width:32px;height:32px;border-radius:8px;border:none;background:none;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.phx:hover{background:var(--surface-2);color:var(--text);}
.pb{padding:18px;overflow-y:auto;flex:1;}
.sheet-handle{display:none;}
.fg{margin-bottom:14px;}
.fg-row{display:flex;gap:10px;}
.fg-row .fg{flex:1;min-width:0;}
label{display:block;font-size:11px;color:var(--text-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
#panel input[type=text],#panel select,#panel textarea,.modal select,.modal textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;
  font-size:14px;outline:none;transition:border-color .12s;}
#panel input[type=text]:focus,#panel select:focus,#panel textarea:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent-line);}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
#panel textarea{resize:vertical;min-height:72px;line-height:1.45;}
select{cursor:pointer;}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
.seg-o{flex:1;height:32px;border-radius:7px;border:none;background:none;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.seg-o .gdot{width:8px;height:8px;border-radius:50%;}
.seg-o:hover{color:var(--text);}
.seg-o.sel{background:var(--surface-3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25);}
.photo-row{display:flex;align-items:center;gap:12px;}
.photo-prev{width:52px;height:52px;border-radius:50%;background:var(--surface-2);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-faint);flex-shrink:0;}
.photo-prev img{width:100%;height:100%;object-fit:cover;}
.ghost-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);font-size:13px;cursor:pointer;transition:color .12s,border-color .12s;}
.ghost-btn:hover{color:var(--text);border-color:var(--border-strong);}
.danger-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;border:1px solid rgba(242,95,85,.35);
  background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;}
.danger-btn:hover{background:rgba(242,95,85,.2);}
.form-actions{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:-18px;background:var(--side);padding:12px 0 2px;}
.form-actions .primary-btn{flex:1;justify-content:center;height:38px;}
.form-actions .ghost-btn{height:38px;}

.hero{padding:22px 18px 18px;text-align:center;border-bottom:1px solid var(--border);--g:var(--neutral);
  background:linear-gradient(180deg,color-mix(in srgb,var(--g) 13%,transparent),transparent);}
.hero.g-male{--g:var(--male);} .hero.g-female{--g:var(--female);}
.hero-av{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;background:color-mix(in srgb,var(--g) 20%,var(--surface-2));display:flex;align-items:center;justify-content:center;
  color:var(--g);font-size:24px;font-weight:700;overflow:hidden;box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 60%,transparent),0 0 24px -4px var(--g);}
.hero-av img{width:100%;height:100%;object-fit:cover;}
.hero-name{font-size:18px;font-weight:650;letter-spacing:-0.01em;}
.hero-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);display:inline-flex;align-items:center;gap:5px;}
.chip.mono{font-size:11px;}
.sect{padding:16px 18px;border-bottom:1px solid var(--border);}
.sect:last-child{border-bottom:none;}
.sect-title{font-size:11px;color:var(--text-faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.drow{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:13px;}
.dlabel{color:var(--text-faint);}
.dval{color:var(--text);text-align:right;}
.dbio{font-size:13px;color:var(--text-dim);line-height:1.6;white-space:pre-wrap;}
.clist{list-style:none;display:flex;flex-direction:column;gap:4px;}
.clist li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:9px;cursor:pointer;transition:background .12s;}
.clist li:hover{background:var(--surface-2);}
.clist .cl-name{font-size:13px;font-weight:550;}
.clist .cl-rel{font-size:11.5px;color:var(--text-faint);}
.clist .rx{margin-left:auto;width:26px;height:26px;border-radius:7px;border:none;background:none;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.6;}
.clist .rx:hover{opacity:1;color:var(--danger);background:var(--danger-soft);}
.mav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;--g:var(--neutral);
  background:color-mix(in srgb,var(--g) 20%,var(--surface-2));color:var(--g);}
.mav.g-male{--g:var(--male);} .mav.g-female{--g:var(--female);}
.mav img{width:100%;height:100%;object-fit:cover;}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.quick-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;border:1px dashed var(--border-strong);background:transparent;
  color:var(--text-dim);font-size:12.5px;cursor:pointer;transition:all .12s;}
.quick-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
.empty-links{font-size:12.5px;color:var(--text-faint);line-height:1.5;}
.detail-actions{display:flex;gap:8px;}
.detail-actions .primary-btn{flex:1;justify-content:center;height:36px;}
.detail-actions .danger-btn{height:36px;}

/* ═══════════ MODALS ═══════════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(6,7,10,0.62);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.overlay.open{display:flex;}
.modal{background:var(--surface-2);border-radius:14px;padding:22px;width:380px;max-width:92vw;box-shadow:var(--shadow-pop);animation:pop .16s ease;}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px);}to{opacity:1;transform:none;}}
.modal h3{font-size:16px;font-weight:650;margin-bottom:6px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;}
.modal p.msub{font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}
.modal .fg select{background:var(--surface);}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.modal-foot .primary-btn,.modal-foot .ghost-btn,.modal-foot .danger-btn{height:36px;}
.modal textarea.mono{font-family:var(--mono);font-size:11px;height:100px;resize:none;}
.mi{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
.mi.warn{background:var(--danger-soft);color:var(--danger);}
.settings-box{width:460px;max-height:86vh;overflow-y:auto;}
.set-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.set-head h3{margin:0;font-size:18px;}
.set-group{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin:18px 4px 4px;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px;border-radius:9px;margin-top:6px;background:var(--surface);}
.set-title{font-size:14px;font-weight:600;color:var(--text);}
.set-desc{font-size:11.5px;color:var(--text-faint);margin-top:3px;line-height:1.4;max-width:230px;}
.set-row .ghost-btn{flex-shrink:0;}
.modal .set-row select.lang-select{width:auto;min-width:90px;height:34px;padding:0 12px;font-size:13px;background:var(--surface-2);text-align:left;}
.set-foot{margin-top:16px;font-size:11.5px;color:var(--text-faint);text-align:center;}

/* ═══════════ TOAST ═══════════ */
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--surface-3);color:var(--text);padding:9px 10px 9px 16px;border-radius:10px;
  font-size:13px;box-shadow:var(--shadow-pop);transition:transform .25s ease,opacity .25s;opacity:0;z-index:999;display:flex;align-items:center;gap:12px;max-width:92vw;}
#toast.show{transform:translate(-50%,0);opacity:1;}
#toast .t-act{background:none;border:none;color:var(--accent);font-weight:650;font-size:13px;cursor:pointer;padding:3px 6px;border-radius:6px;}
#toast .t-act:hover{background:var(--accent-soft);}
#toast:not(.has-act){padding-right:16px;}

/* ═══════════ MOBILE ═══════════ */
@media (max-width:760px){
  .set-desc{display:none;}
  .only-mobile{display:flex!important;}
  .only-desktop{display:none!important;}
  .topbar{padding:0 10px;padding-top:env(safe-area-inset-top);gap:6px;height:auto;min-height:54px;}
  .brand{font-size:16px;}
  .brand-ver{display:none;}
  .search-wrap{display:none;margin-left:0;max-width:none;}
  body.search-open .search-wrap{display:flex;position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:5;height:36px;}
  body.search-open .search-results{left:0;right:0;}
  .iconbtn{height:36px;}
  .icon-only{width:36px;}
  .primary-btn{height:36px;padding:0 12px;}
  .primary-btn .lbl{display:none;}
  .toolbar{top:8px;left:8px;right:8px;max-width:none;}
  .tbtn{height:38px;padding:0 10px;}
  .tbtn .lbl{display:none;}
  .zoom-ctl{right:10px;bottom:calc(14px + env(safe-area-inset-bottom));}
  .zoom-ctl .tbtn{width:42px;height:40px;}
  .legend{display:none;}
  #marquee{display:none!important;}
  .port{width:20px;height:20px;}
  .port-t{top:-11px;} .port-b{bottom:-11px;} .port-l{left:-11px;} .port-r{right:-11px;}
  .port::after{display:none;}
  .cta{height:38px;}
  .ctool{height:24px;min-width:24px;}
  #panel{position:fixed;left:0;right:0;bottom:0;width:100%!important;max-height:86vh;height:auto;z-index:150;border-left:none;border-top:1px solid var(--border-strong);
    border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom);animation:sheetIn .2s ease;}
  @keyframes sheetIn{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet-handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:8px auto 0;flex-shrink:0;}
  .ph{height:46px;}
  #panel input[type=text],#panel select,#panel textarea,.modal select{font-size:16px;padding:11px 12px;}
  .search-wrap input{font-size:16px;}
  .seg-o{height:38px;}
  .overlay{align-items:flex-end;}
  .modal{width:100%;max-width:100%;border-radius:18px 18px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));}
  .modal-foot .primary-btn,.modal-foot .ghost-btn,.modal-foot .danger-btn{flex:1;justify-content:center;height:42px;}
  .menu{position:fixed!important;top:auto!important;bottom:0!important;left:0!important;right:0!important;min-width:0!important;border-radius:18px 18px 0 0;
    padding:10px 10px calc(20px + env(safe-area-inset-bottom));max-height:75vh;overflow-y:auto;}
  .menu-item{padding:13px 12px;font-size:15px;}
  .ctx-menu{left:0!important;right:0!important;top:auto!important;bottom:0!important;border-radius:18px 18px 0 0;padding:10px 10px calc(20px + env(safe-area-inset-bottom));max-height:75vh;overflow-y:auto;}
  .ctx-menu .kbd{display:none;}
  #toast{bottom:calc(20px + env(safe-area-inset-bottom));}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-dot"></span><span>Arbolito App</span><span class="brand-ver">v3.3</span></div>
  <div class="search-wrap" id="search-wrap">
    <span data-icon="search"></span>
    <input type="text" id="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh">
    <span class="search-kbd only-desktop">/</span>
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="counter only-desktop" id="counter"></div>
  <button class="iconbtn icon-only only-mobile" id="btn-search-m" title="Buscar" data-icon="search"></button>
  <select class="lang-select only-desktop" id="lang-select"><option value="es">ESP</option><option value="en">ENG</option></select>
  <button class="iconbtn icon-only" id="btn-settings" data-i18n-title="settingsTitle" data-icon="settings"></button>
  <button class="primary-btn" id="btn-add"><span data-icon="plus"></span><span class="lbl" data-i18n="add"></span></button>
</header>

<div class="workspace">
  <div class="stage">
    <div id="cw">
      <svg id="wire-svg"></svg>
      <div id="canvas"><svg id="conn-svg"></svg></div>
      <div id="marquee"></div>
      <div id="empty">
        <div class="ei" data-icon="tree"></div>
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n="emptyHint"></p>
        <button class="primary-btn" id="btn-empty-add"><span data-icon="plus"></span><span data-i18n="addFirst"></span></button>
      </div>
    </div>

    <div class="hud">
      <div class="toolbar glass">
        <button class="tbtn" id="btn-undo" data-i18n-title="undoT"><span data-icon="undo"></span></button>
        <button class="tbtn" id="btn-redo" data-i18n-title="redoT"><span data-icon="redo"></span></button>
        <div class="tsep"></div>
        <button class="tbtn tbtn--accent" id="btn-organize" data-i18n-title="organizeT"><span data-icon="network"></span><span class="lbl" data-i18n="organize"></span></button>
        <button class="tbtn" id="btn-align" data-i18n-title="alignT"><span data-icon="align"></span><span class="lbl" data-i18n="align"></span></button>
        <div class="tsep"></div>
        <button class="tbtn" id="btn-fit"><span data-icon="fit"></span><span class="lbl" data-i18n="fit"></span></button>
        <button class="tbtn" id="btn-collapse-all"><span data-icon="collapse"></span><span class="lbl" data-i18n="collapse"></span></button>
        <div class="tsep"></div>
        <div class="drop">
          <button class="tbtn" id="btn-style"><span data-icon="sliders"></span><span class="lbl" data-i18n="style"></span></button>
          <div class="menu menu--left" id="settings-menu">
            <div class="menu-label" data-i18n="theme"></div>
            <button class="menu-item" data-set="theme:dark"><span class="sw" style="background:#0f1116"></span><span data-i18n="themeDark"></span><span class="check" data-icon="check"></span></button>
            <button class="menu-item" data-set="theme:light"><span class="sw" style="background:#f3f4f7"></span><span data-i18n="themeLight"></span><span class="check" data-icon="check"></span></button>
            <div class="menu-label" data-i18n="connections"></div>
            <button class="menu-item" data-set="conn:ortho"><span data-icon="ortho"></span><span data-i18n="connOrtho"></span><span class="check" data-icon="check"></span></button>
            <button class="menu-item" data-set="conn:bezier"><span data-icon="curve"></span><span data-i18n="connBezier"></span><span class="check" data-icon="check"></span></button>
            <div class="menu-label" data-i18n="show"></div>
            <button class="menu-item" data-set="boxes"><span data-icon="box"></span><span data-i18n="showBoxes"></span><span class="check" data-icon="check"></span></button>
            <button class="menu-item" data-set="labels"><span data-icon="tag"></span><span data-i18n="showLabels"></span><span class="check" data-icon="check"></span></button>
            <button class="menu-item" data-set="ids"><span data-icon="hash"></span><span data-i18n="showIds"></span><span class="check" data-icon="check"></span></button>
            <button class="menu-item" data-set="legend"><span data-icon="info"></span><span data-i18n="showLegend"></span><span class="check" data-icon="check"></span></button>
          </div>
        </div>
      </div>

      <div class="legend glass" id="legend">
        <div class="legend-head" id="legend-head"><span data-i18n="legend"></span><span data-icon="chevdown"></span></div>
        <div class="legend-body">
          <div class="legend-row"><div class="leg-line" style="border-color:var(--c-padre)"></div><span data-i18n="legParent"></span></div>
          <div class="legend-row"><div class="leg-line" style="border-color:var(--c-pareja)"></div><span data-i18n="legCouple"></span></div>
          <div class="legend-row"><div class="leg-line" style="border-color:var(--c-hermano);border-top-style:dashed"></div><span data-i18n="legSibling"></span></div>
          <div class="legend-sep"></div>
          <div class="legend-row"><div class="leg-dot" style="border:2px solid var(--accent)"></div><span data-i18n="legPortV"></span></div>
          <div class="legend-row"><div class="leg-dot" style="border:2px solid var(--amber)"></div><span data-i18n="legPortH"></span></div>
          <div class="legend-sep"></div>
          <div class="legend-hint" data-i18n-html="legPan"></div>
          <div class="legend-hint" data-i18n-html="legSelect"></div>
          <div class="legend-hint" data-i18n-html="legEdit"></div>
          <div class="legend-hint" data-i18n-html="legUndo"></div>
        </div>
      </div>

      <div class="zoom-ctl glass">
        <button class="tbtn" id="btn-zin" data-icon="plus"></button>
        <div class="zoom-pct" id="zoom-pct">100%</div>
        <button class="tbtn" id="btn-zout" data-icon="minus"></button>
      </div>
    </div>
  </div>
  <div id="panel" style="display:none"></div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settings-modal">
  <div class="modal settings-box">

  hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  arrowup:'<path d="M12 19V5M5 12l7-7 7 7"/>',arrowdown:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  arrows:'<path d="m8 3-4 4 4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
};
function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}

/* ── helpers ── */
const $=s=>document.querySelector(s);
const uid=()=>'p'+(S.nextId++);
const gc=g=>g==='masculino'?'male':g==='femenino'?'female':'neutral';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fullName=p=>{
  if(!p)return '?';
  var fn=p.firstName||p.name||'';var mn=p.middleName||'';var ln=p.lastName||'';
  var full=[fn,mn,ln].filter(Boolean).join(' ').trim();
  if(full.length>22&&mn.length>1)mn=mn[0]+'.';
  return[fn,mn,ln].filter(Boolean).join(' ').trim()||t('noName');
};
const cardInitials=p=>{
  const parts=[p.firstName||p.name||'',p.middleName||'',p.lastName||''].filter(Boolean);
  if(parts.length>=2)return parts.map(w=>w[0]).join('').slice(0,3).toUpperCase();
  return fullName(p).split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
};
const yearsOf=p=>[p.birth,p.death].filter(Boolean).join(' – ');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function avatarHTML(p,cls){return p.photo?'<img src="'+p.photo+'" alt="">':'<span class="'+(cls||'')+'">'+esc(cardInitials(p))+'</span>';}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function openModal(id){document.getElementById(id).classList.add('open');}
function hydrateIcons(root){(root||document).querySelectorAll('[data-icon]').forEach(el=>{if(el.dataset.iconDone)return;el.dataset.iconDone=1;el.insertAdjacentHTML('afterbegin',ic(el.dataset.icon));});}

/* ════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════ */
const S = {
  people:{}, connections:[], nextId:1,
  selectedId:null,
  panelMode:null, editingId:null, photoData:null,
  zoom:1, panX:60, panY:60,
  panning:false, panStart:null,
  draggingCard:null, dragOffset:null, didDrag:false,
  wiringFrom:null, wiringFromPort:null, wiringTo:null, wireMouseX:0, wireMouseY:0,
  deletingId:null, deletingConn:null,
  relFrom:null, relTo:null,
  marquee:null, selectedIds:new Set(),
  actionConnIdx:null,
  _bulkDeleteIds:null, _reorderPersonId:null, _justMarqueed:false,
  collapsed:{},
  _newNodeX:undefined, _newNodeY:undefined,
  _pendingHermano:null, _secCollapsed:{}, _pendingImport:null,
  _dbgGen:{},
  _quickRel:null,
  famCollapsed:{},   // parent-set key → {rep, off:{id:[dx,dy]}}
  // view prefs
  _theme:'dark', _connStyle:'ortho', showBoxes:false, showLabels:true, showLegend:true, showIds:false,
};

/* ── persistence + undo history ── */
const HIST={undo:[],redo:[],last:null,max:80};
const PHOTO_CACHE={};  // id → photo (photos are kept out of undo snapshots)
let _quotaWarned=false;
function snapshot(){
  const people={};
  for(const id in S.people){const p=S.people[id];if(p.photo)PHOTO_CACHE[id]=p.photo;const c=Object.assign({},p);delete c.photo;people[id]=c;}
  return JSON.stringify({people,connections:S.connections,nextId:S.nextId,collapsed:S.collapsed,_dbgGen:S._dbgGen||{},_sec:S._secCollapsed||{},fam:S.famCollapsed||{}});
}
function persist(){
  const snap=snapshot();
  if(HIST.last!==null&&snap!==HIST.last){HIST.undo.push(HIST.last);if(HIST.undo.length>HIST.max)HIST.undo.shift();HIST.redo.length=0;}
  HIST.last=snap;
  try{
    localStorage.setItem('gt3',JSON.stringify({people:S.people,connections:S.connections,nextId:S.nextId,collapsed:S.collapsed,_dbgGen:S._dbgGen||{},_secCollapsed:S._secCollapsed||{},famCollapsed:S.famCollapsed||{}}));
  }catch(e){
    if(!_quotaWarned){_quotaWarned=true;toast(t('quotaErr'),{action:t('export'),fn:exportData,ms:9000});}
  }
  updateHistoryUI(); updateCounter();
}
function restoreSnap(snap){
  const d=JSON.parse(snap);
  for(const id in d.people){if(PHOTO_CACHE[id])d.people[id].photo=PHOTO_CACHE[id];}
  S.people=d.people;S.connections=d.connections;S.nextId=d.nextId;S.collapsed=d.collapsed||{};S._dbgGen=d._dbgGen||{};S._secCollapsed=d._sec||{};S.famCollapsed=d.fam||{};
  HIST.last=snap;
  try{localStorage.setItem('gt3',JSON.stringify({people:S.people,connections:S.connections,nextId:S.nextId,collapsed:S.collapsed,_dbgGen:S._dbgGen,_secCollapsed:S._secCollapsed,famCollapsed:S.famCollapsed}));}catch(e){}
  S.selectedIds.forEach(id=>{if(!S.people[id])S.selectedIds.delete(id);});
  if(S.selectedId&&!S.people[S.selectedId])S.selectedId=null;
  renderAll();
  if(S.panelMode==='detail'&&S.selectedId)openDetailPanel(S.selectedId);else if(S.panelMode)closePanel();
  updateHistoryUI();updateCounter();
}
function undo(){if(!HIST.undo.length){toast(t('nothingUndo'));return;}HIST.redo.push(HIST.last);restoreSnap(HIST.undo.pop());toast(t('undone'));}
function redo(){if(!HIST.redo.length)return;HIST.undo.push(HIST.last);restoreSnap(HIST.redo.pop());toast(t('redone'));}
function updateHistoryUI(){$('#btn-undo').disabled=!HIST.undo.length;$('#btn-redo').disabled=!HIST.redo.length;}
function updateCounter(){const n=Object.keys(S.people).length;$('#counter').innerHTML='<b>'+n+'</b> '+(n===1?t('person'):t('people'));}

function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem('gt3')||'null');
    if(d){S.people=d.people||{};S.connections=d.connections||[];S.nextId=d.nextId||1;S.collapsed=d.collapsed||{};S._dbgGen=d._dbgGen||{};S._secCollapsed=d._secCollapsed||{};S.famCollapsed=d.famCollapsed||{};}
  }catch(e){}
  sanitize();
}
// Make the data safe: drop dangling/duplicate/self links, keep nextId ahead of every id.
function sanitize(){
  const seen=new Set();
  S.connections=(S.connections||[]).filter(c=>{
    if(!c||!S.people[c.from]||!S.people[c.to]||c.from===c.to)return false;
    if(c.type==='hijo'){const tmp=c.from;c.from=c.to;c.to=tmp;c.type='padre';}
    if(['padre','pareja','hermano'].indexOf(c.type)<0)return false;
    const k=c.type==='padre'?c.from+'>'+c.to:[c.from,c.to].sort().join('|');
    const k2=[c.from,c.to].sort().join('|');
    if(seen.has(k)||seen.has('any:'+k2))return false;
    seen.add(k);seen.add('any:'+k2);return true;
  });
  let mx=0;for(const id in S.people){const n=parseInt(String(id).replace(/\D/g,''),10);if(isFinite(n)&&n>mx)mx=n;
    const p=S.people[id];if(!isFinite(p.x))p.x=0;if(!isFinite(p.y))p.y=0;}
  if(!(S.nextId>mx))S.nextId=mx+1;
}

/* ════════════════════════════════════════════════════════════════
   VIEW (pan / zoom)
   ════════════════════════════════════════════════════════════════ */
const cwEl=document.getElementById('cw');
const canvasEl=document.getElementById('canvas');
const ZMIN=0.05,ZMAX=2.5;
function applyTransform(){
  canvasEl.style.transform=`translate3d(${S.panX}px,${S.panY}px,0) scale(${S.zoom})`;
  const gs=24*S.zoom; const g=gs<8?gs*4:(gs<14?gs*2:gs);
  cwEl.style.setProperty('--gs',g+'px');cwEl.style.setProperty('--gx',S.panX+'px');cwEl.style.setProperty('--gy',S.panY+'px');
  canvasEl.classList.toggle('lod-far',S.zoom<0.42);
  const zp=document.getElementById('zoom-pct');if(zp)zp.textContent=Math.round(S.zoom*100)+'%';
}
function zoomAt(nz,mx,my){nz=Math.max(ZMIN,Math.min(ZMAX,nz));S.panX=mx-(mx-S.panX)*(nz/S.zoom);S.panY=my-(my-S.panY)*(nz/S.zoom);S.zoom=nz;applyTransform();}
function doZoom(f){const r=cwEl.getBoundingClientRect();animateView(Math.max(ZMIN,Math.min(ZMAX,S.zoom*f)),null,null,r.width/2,r.height/2);}
function treeBounds(ids){
  ids=ids||visIds();if(!ids.length)return null;
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  ids.forEach(id=>{const p=S.people[id];if(!p)return;const sz=cardSize(id);mnx=Math.min(mnx,p.x||0);mny=Math.min(mny,p.y||0);mxx=Math.max(mxx,(p.x||0)+sz.w);mxy=Math.max(mxy,(p.y||0)+sz.h);});
  return {x:mnx,y:mny,w:mxx-mnx||1,h:mxy-mny||1};
}
function fitScreen(instant){
  const b=treeBounds();if(!b)return;
  const r=cwEl.getBoundingClientRect();
  const mob=r.width<760;
  const padX=mob?24:70, padTop=mob?64:76, padBot=mob?40:60;
  const z=Math.max(ZMIN,Math.min(1.2,Math.min((r.width-2*padX)/b.w,(r.height-padTop-padBot)/b.h)));
  const px=Math.round((r.width-b.w*z)/2-b.x*z), py=Math.round(padTop+((r.height-padTop-padBot)-b.h*z)/2-b.y*z);
  if(instant===true){S.zoom=z;S.panX=px;S.panY=py;applyTransform();}
  else animateView(z,px,py);
}
function resetView(){fitScreen();}
let _viewAnim=null;
function animateView(z,px,py,ax,ay){
  // ax/ay: zoom anchor (screen) when px/py not given
  if(px==null){px=ax-(ax-S.panX)*(z/S.zoom);py=ay-(ay-S.panY)*(z/S.zoom);}
  if(_viewAnim)cancelAnimationFrame(_viewAnim);
  const z0=S.zoom,x0=S.panX,y0=S.panY,t0=performance.now(),D=260;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){S.zoom=z;S.panX=px;S.panY=py;applyTransform();return;}
  (function step(now){
    const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);
    S.zoom=z0+(z-z0)*e;S.panX=x0+(px-x0)*e;S.panY=y0+(py-y0)*e;applyTransform();
    if(k<1)_viewAnim=requestAnimationFrame(step);else _viewAnim=null;
  })(t0);
}
function focusPerson(id,keepZoom){
  const p=S.people[id];if(!p)return;
  const r=cwEl.getBoundingClientRect();const sz=cardSize(id);
  const z=keepZoom?S.zoom:Math.max(S.zoom,0.85);
  const panelOpen=$('#panel').style.display!=='none'&&r.width>=760;
  const cx=(p.x||0)+sz.w/2, cy=(p.y||0)+sz.h/2;
  animateView(z, r.width/2-cx*z, (r.height/2)-cy*z);
  selectCard(id);
  const el=CARDS.get(id);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1500);}
}

/* ════════════════════════════════════════════════════════════════
   GRAPH INDEX
   ════════════════════════════════════════════════════════════════ */
/* collapsed families: a couple + all their descendants become ONE block card.
   HIDDEN people are not drawn nor laid out; the father ("rep") carries the block,
   ALIAS sends the other parent's links to the block; VCONNS = visible links. */
let HIDDEN=new Set(),REPS={},HIDKEY={},ALIAS={},VCONNS=[];
function visIds(){return Object.keys(S.people).filter(id=>!HIDDEN.has(id));}
function graph(raw){
  const par={},ch={},coup={},sib={},deg={},coupConns={};
  for(const id in S.people){par[id]=[];ch[id]=[];coup[id]=[];sib[id]=[];deg[id]=0;coupConns[id]=[];}
  (raw?S.connections:VCONNS).forEach((c,i)=>{
    if(!S.people[c.from]||!S.people[c.to])return;
    deg[c.from]++;deg[c.to]++;
    if(c.type==='padre'){if(ch[c.from].indexOf(c.to)<0)ch[c.from].push(c.to);if(par[c.to].indexOf(c.from)<0)par[c.to].push(c.from);}
    else if(c.type==='pareja'){if(coup[c.from].indexOf(c.to)<0)coup[c.from].push(c.to);if(coup[c.to].indexOf(c.from)<0)coup[c.to].push(c.from);coupConns[c.from].push(c);coupConns[c.to].push(c);}
    else if(c.type==='hermano'){sib[c.from].push(c.to);sib[c.to].push(c.from);}
  });
  return {par,ch,coup,sib,deg,coupConns};
}

function famKids(key,G){G=G||graph(true);return Object.keys(S.people).filter(id=>G.par[id].length&&G.par[id].slice().sort().join('+')===key);}
function famParents(key){return key.split('+').filter(id=>S.people[id]);}
function famFather(key){const ps=famParents(key);return ps.find(id=>S.people[id].gender==='masculino')||ps[0];}
function surnameOf(id){const p=S.people[id];return p?((p.lastName||'').trim().split(/\s+/)[0]||(p.firstName||p.name||'').trim().split(/\s+/)[0]||''):'';}
function famName(key){
  // father's surname first, then mother's ("Familia Bravo Fernández")
  const ps=famParents(key).sort((a,b)=>(S.people[a].gender==='masculino'?0:1)-(S.people[b].gender==='masculino'?0:1));
  return [...new Set(ps.map(surnameOf).filter(Boolean))].join(' ');
}
function computeHidden(){
  HIDDEN=new Set();REPS={};HIDKEY={};ALIAS={};
  if(!S.famCollapsed)S.famCollapsed={};
  const G=graph(true);
  Object.keys(S.famCollapsed).forEach(key=>{
    const ps=famParents(key),kids=famKids(key,G);
    if(!ps.length||!kids.length){delete S.famCollapsed[key];return;}
    const fc=S.famCollapsed[key],rep=famFather(key);
    if(fc.rep!==rep||fc.v!==2){fc.rep=rep;fc.v=2;fc.off=null;}   // older kids-only collapses
    REPS[rep]=key;
    ps.forEach(pp=>{if(pp!==rep){HIDDEN.add(pp);if(!HIDKEY[pp])HIDKEY[pp]=key;ALIAS[pp]=rep;}});
    const seen=new Set(kids.concat(ps)),q=kids.slice();
    while(q.length){
      const x=q.shift();
      HIDDEN.add(x);if(!HIDKEY[x])HIDKEY[x]=key;
      G.ch[x].forEach(k=>{if(!seen.has(k)){seen.add(k);q.push(k);}});
      G.coup[x].forEach(pp=>{if(!G.par[pp].length&&!seen.has(pp)){seen.add(pp);q.push(pp);}});
    }
  });
  Object.keys(REPS).forEach(r=>{if(HIDDEN.has(r))delete REPS[r];});
  const res=x=>{let g=0;while(ALIAS[x]&&g++<12)x=ALIAS[x];return HIDDEN.has(x)?null:x;};
  VCONNS=[];const seen=new Set();
  S.connections.forEach((c,i)=>{
    if(!S.people[c.from]||!S.people[c.to])return;
    const a=res(c.from),b=res(c.to);
    if(!a||!b||a===b)return;
    const k=c.type==='padre'?'P'+a+'>'+b:c.type[0]+[a,b].sort().join('|');
    if(seen.has(k))return;seen.add(k);
    VCONNS.push({from:a,to:b,type:c.type,ci:i});
  });
}
function famInfo(key){
  const G=graph(true);
  const kids=famKids(key,G).sort((a,b)=>(S.people[a].x||0)-(S.people[b].x||0));
  const ps=famParents(key).sort((a,b)=>(S.people[a].gender==='masculino'?0:1)-(S.people[b].gender==='masculino'?0:1));
  const inside=Object.keys(HIDKEY).filter(id=>HIDKEY[id]===key).length+1;
  return {name:famName(key),kids,parents:ps,inside};
}
function collapseFamily(key){
  const ps=famParents(key),kids=famKids(key);if(!ps.length||!kids.length)return;
  const rep=famFather(key);
  S.famCollapsed[key]={rep,v:2,off:{}};
  computeHidden();
  const rp=S.people[rep];
  Object.keys(HIDKEY).forEach(id=>{if(HIDKEY[id]===key)S.famCollapsed[key].off[id]=[(S.people[id].x||0)-(rp.x||0),(S.people[id].y||0)-(rp.y||0)];});
  // the block sits where the couple was
  const xs=ps.map(pp=>S.people[pp].x||0);
  const sh=(Math.min(...xs)+Math.max(...xs))/2-(rp.x||0);
  rp.x=(rp.x||0)+sh;Object.values(S.famCollapsed[key].off).forEach(o=>{o[0]-=sh;});
  S.selectedIds.forEach(id=>{if(HIDDEN.has(id))S.selectedIds.delete(id);});
  if(S.selectedId&&HIDDEN.has(S.selectedId)){S.selectedId=null;closePanel();}
  renderAll();autoLayout(t('famCollapsed'));
}
function expandFamily(key,noLayout){
  const fc=S.famCollapsed[key];if(!fc)return;
  const rp=S.people[fc.rep];
  if(rp&&fc.off){
    // put everyone back around the family card, keeping their old arrangement
    // put everyone back around the block, keeping their old arrangement; the couple
    // is re-centred where the block was
    const ids=Object.keys(fc.off).filter(id=>S.people[id]);
    const ps=famParents(key);
    const pxs=ps.map(pp=>pp===fc.rep?0:(fc.off[pp]?fc.off[pp][0]:0));
    const mid=(Math.min(...pxs)+Math.max(...pxs))/2;
    ids.forEach(id=>{S.people[id].x=(rp.x||0)+fc.off[id][0]-mid;S.people[id].y=(rp.y||0)+fc.off[id][1];});
    rp.x=(rp.x||0)-mid;
  }
  delete S.famCollapsed[key];
  computeHidden();renderAll();
  if(S.selectedId===fc.rep)selectCard(fc.rep);
  if(!noLayout)autoLayout(t('famExpanded'));
}
// make sure a person is visible (expands the families that hide it)
function reveal(id){
  let changed=false,guard=0;
  while(HIDDEN.has(id)&&guard++<20){expandFamily(HIDKEY[id],true);changed=true;}
  if(REPS[id]){expandFamily(REPS[id],true);changed=true;}
  return changed;
}
function revealAndFocus(id,openPanel){
  if(reveal(id)){autoLayout(t('famExpanded'));setTimeout(()=>{if(openPanel)openDetailPanel(id);focusPerson(id);},560);}
  else{if(openPanel)openDetailPanel(id);focusPerson(id);}
}

/* ════════════════════════════════════════════════════════════════
   RENDER — cards
   ════════════════════════════════════════════════════════════════ */
const CARDS=new Map();   // id → element
const SIZES=new Map();   // id → {w,h}
function getCard(id){return CARDS.get(id)||null;}
function cardSize(id){return SIZES.get(id)||{w:CARD_W,h:S.collapsed[id]?58:126};}
function measureCard(id){const el=CARDS.get(id);if(el)SIZES.set(id,{w:el.offsetWidth||CARD_W,h:el.offsetHeight||126});}

function renderAll(){
  computeHidden();
  for(const [id,el] of CARDS){if(!S.people[id]||HIDDEN.has(id)){el.remove();CARDS.delete(id);SIZES.delete(id);}}
  document.getElementById('empty').style.display=Object.keys(S.people).length?'none':'block';
  const vis=visIds();
  for(const id of vis) buildCard(id,true);
  for(const id of vis) measureCard(id);

  if(btn){const ids=Object.keys(S.people);const anyExp=!ids.length||ids.some(id=>!S.collapsed[id]);
    btn.innerHTML=ic(anyExp?'collapse':'expand')+'<span class="lbl">'+t(anyExp?'collapse':'expand')+'</span>';}
}

function buildCard(id,skipMeasure){

      '<div class="port port-l" data-port="l" data-id="'+id+'" data-tip="'+esc(t('couplePort'))+'"></div>'+
      '<div class="port port-r" data-port="r" data-id="'+id+'" data-tip="'+esc(t('couplePort'))+'"></div>'+
    '</div>'+

        (years?'<div class="card-sub">'+esc(years)+'</div>':'')+'</div>'+
      '<div class="card-tools">'+
        (secCount>0?'<button class="ctool couple" data-tool="sec" title="'+esc(t('moreCouples'))+'">'+ic('heart')+(S._secCollapsed&&S._secCollapsed[id]?'+'+secCount:'')+'</button>':'')+
        '<button class="ctool" data-tool="collapse" title="'+esc(t(col?'expand':'collapse'))+'">'+ic(col?'chevright':'chevdown')+'</button>'+
      '</div>'+

      (p.birthplace?'<div class="card-place">'+ic('pin')+esc(p.birthplace)+'</div>':'<div class="card-place"></div>')+

function buildFamCard(id,card){
  const key=REPS[id],p=S.people[id],info=famInfo(key);
  card.className='card fam-card'+(S.selectedId===id||S.selectedIds.has(id)?' selected':'');
  card.style.left=(p.x||0)+'px';card.style.top=(p.y||0)+'px';
  const face=k=>{const q=S.people[k];return '<div class="fam-face g-'+gc(q.gender)+'" title="'+esc(fullName(q))+'">'+esc(cardInitials(q).slice(0,2))+'</div>';};
  const faces=info.parents.map(face).join('')+'<div class="fam-sep"></div>'+info.kids.slice(0,5).map(face).join('')+
    (info.kids.length>5?'<div class="fam-face more">+'+(info.kids.length-5)+'</div>':'');
  const extra=info.inside-info.parents.length-info.kids.length;
  card.innerHTML='<div class="sel-ring"></div>'+
    '<div class="card-head" data-drag="'+id+'"><div class="avatar">'+ic('users')+'</div>'+
      '<div class="card-title"><div class="card-name">'+esc(t('family')+' '+info.name)+'</div>'+
      '<div class="card-sub">'+esc((info.kids.length===1?t('famSub1'):t('famSub')).replace('{n}',info.kids.length))+(extra>0?' · +'+extra:'')+'</div></div></div>'+
    '<div class="fam-faces">'+faces+'</div>'+
    '<div class="card-btns"><button class="cta" data-action="expand">'+ic('expand')+t('expandFam')+'</button></div>';
}
function moveCardEl(id){const p=S.people[id],el=CARDS.get(id);if(p&&el){el.style.left=p.x+'px';el.style.top=p.y+'px';}}

function attachCard(card){
  card.addEventListener('mousedown',onCardMD);
  card.addEventListener('click',onCardClick);
  card.addEventListener('dblclick',onCardDblClick);
}
function onCardMD(e){
  if(e.button!==0)return;
  if(e.target.closest('.ctool')||e.target.closest('.cta'))return;
  if(e.altKey||document.body.classList.contains('space-pan'))return; // let the canvas pan
  const drag=e.target.closest('[data-drag]')||(e.target.closest('.card-body')?e.target.closest('.card'):null);
  if(!drag)return;
  e.stopPropagation();
  const id=drag.dataset.drag||drag.dataset.id;
  startCardDrag(id,e.clientX,e.clientY);
  document.body.classList.add('no-select');
}
function startCardDrag(id,clientX,clientY){
  S.draggingCard=id;S.didDrag=false;
  // Rigid lateral link: follower (NO parents) follows an anchor (HAS parents).
  S.connections.forEach(function(c){
    if(c.type!=='pareja'&&c.type!=='hermano')return;
    var aHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.from;});
    var bHasPar=S.connections.some(function(x){return x.type==='padre'&&x.to===c.to;});
    if(aHasPar===bHasPar)return;
    var anchorId=aHasPar?c.from:c.to, floatId=aHasPar?c.to:c.from;
    var anchor=S.people[anchorId],floater=S.people[floatId];
    if(!anchor||!floater)return;
    var key='_roff_'+[anchorId,floatId].sort().join('|');
    if(S[key]===undefined||id===floatId){S[key]=(floater.x||0)-(anchor.x||0);}
  });
  const p=S.people[id];
  const r=cwEl.getBoundingClientRect();
  const wx=(clientX-r.left-S.panX)/S.zoom,wy=(clientY-r.top-S.panY)/S.zoom;
  S.dragOffset={x:wx-(p.x||0),y:wy-(p.y||0)};
}
function dragCardTo(clientX,clientY){
  const id=S.draggingCard;const p=S.people[id];if(!p)return;
  const r=cwEl.getBoundingClientRect();
  const nx=(clientX-r.left-S.panX)/S.zoom-S.dragOffset.x,ny=(clientY-r.top-S.panY)/S.zoom-S.dragOffset.y;
  const ddx=nx-(p.x||0),ddy=ny-(p.y||0);
  if(!S.didDrag&&Math.abs(ddx)<3/S.zoom&&Math.abs(ddy)<3/S.zoom)return false;
  S.didDrag=true;
  const moveIds=(S.selectedIds.size>1&&S.selectedIds.has(id))?[...S.selectedIds]:[id];
  moveIds.forEach(mid=>{const pp=S.people[mid];if(!pp)return;if(mid===id){pp.x=nx;pp.y=ny;}else{pp.x=(pp.x||0)+ddx;pp.y=(pp.y||0)+ddy;}moveCardEl(mid);});
  moveIds.forEach(mid=>followRigidCouple(mid));
  updateFollowerOffset(id);
  recenterChildren(moveIds);
  scheduleConns();
  return true;
}
function onCardClick(e){
  if(e.target.closest('.port'))return;
  const id=this.dataset.id;
  e.stopPropagation();
  const tool=e.target.closest('.ctool');
  if(tool){if(tool.dataset.tool==='collapse')toggleCollapse(id);else toggleSecondary(id);return;}
  const cta=e.target.closest('.cta');
  const action=cta&&cta.dataset.action;
  if(action==='expand'){expandFamily(REPS[id]);return;}
  if(action==='edit'){openEditPanel(id);return;}
  if(action==='view'){openDetailPanel(id);return;}
  if(action==='del'){askDelete(id);return;}
  if(REPS[id]){if(!S.didDrag)selectCard(id);return;}
  if(!S.didDrag){
    if(e.shiftKey||e.metaKey||e.ctrlKey){toggleInSelection(id);return;}
    selectCard(id);
    openDetailPanel(id);
  }
}
function onCardDblClick(e){
  if(e.target.closest('.port')||e.target.closest('.cta')||e.target.closest('.ctool'))return;
  e.stopPropagation();
  if(REPS[this.dataset.id]){expandFamily(REPS[this.dataset.id]);return;}
  openEditPanel(this.dataset.id);
}
function toggleInSelection(id){
  if(S.selectedIds.has(id))S.selectedIds.delete(id);else S.selectedIds.add(id);
  if(S.selectedId&&!S.selectedIds.has(S.selectedId)&&S.selectedIds.size===0)S.selectedId=null;
  S.selectedId=S.selectedIds.size?[...S.selectedIds][0]:null;
  for(const [cid,el] of CARDS)el.classList.toggle('selected',S.selectedIds.has(cid));
}

/* ── wiring ── */
function attachPort(port){port.addEventListener('mousedown',onPortMD);}
function onPortMD(e){
  if(e.button!==0)return;
  e.stopPropagation();e.preventDefault();
  startWire(e.target.dataset.id,e.target.dataset.port,e.clientX,e.clientY);
}
function startWire(id,portSide,clientX,clientY){
  S.wiringFrom={id,port:portSide};S.wiringFromPort=portSide;
  const r=cwEl.getBoundingClientRect();
  S.wireMouseX=clientX-r.left;S.wireMouseY=clientY-r.top;
  for(const el of CARDS.values())el.classList.remove('wiring-source');
  const src=CARDS.get(id);if(src)src.classList.add('wiring-source');
  document.body.classList.remove('wiring-from-top','wiring-from-bottom','wiring-from-side');
  document.body.classList.add(portSide==='t'?'wiring-from-top':portSide==='b'?'wiring-from-bottom':'wiring-from-side');
  document.body.classList.add('wiring');drawWire();
}
function moveWire(clientX,clientY){
  const r=cwEl.getBoundingClientRect();S.wireMouseX=clientX-r.left;S.wireMouseY=clientY-r.top;
  const target=findCardUnderMouse(S.wireMouseX,S.wireMouseY);
  for(const [cid,el] of CARDS)el.classList.toggle('drop-target',cid===target&&target!==S.wiringFrom.id);
  S.wiringTo=target&&target!==S.wiringFrom.id?target:null;drawWire();
}
function endWire(toIdHint){
  document.body.classList.remove('wiring','wiring-from-top','wiring-from-bottom','wiring-from-side');
  for(const el of CARDS.values())el.classList.remove('drop-target','wiring-source');
  document.getElementById('wire-svg').innerHTML='';
  const fromId=S.wiringFrom.id;
  const toId=(toIdHint&&toIdHint!==fromId)?toIdHint:S.wiringTo;
  S.wiringFrom=null;S.wiringTo=null;
  if(toId)openRelModal(fromId,toId);else S.wiringFromPort=null;
}
function portCanvasPos(id,port){
  const p=S.people[id];if(!p)return{x:0,y:0};
  const sz=cardSize(id);const cx=p.x||0,cy=p.y||0;
  if(port==='t')return{x:cx+sz.w/2,y:cy};
  if(port==='b')return{x:cx+sz.w/2,y:cy+sz.h};
  if(port==='l')return{x:cx,y:cy+sz.h/2};
  if(port==='r')return{x:cx+sz.w,y:cy+sz.h/2};
  return{x:cx+sz.w/2,y:cy+sz.h/2};
}
function portScreenPos(id,port){const c=portCanvasPos(id,port);return{x:c.x*S.zoom+S.panX,y:c.y*S.zoom+S.panY};}
function drawWire(){
  const svg=document.getElementById('wire-svg');
  if(!S.wiringFrom){svg.innerHTML='';return;}
  const port=S.wiringFrom.port;const isV=(port==='t'||port==='b');
  const from=portScreenPos(S.wiringFrom.id,port);const tx=S.wireMouseX,ty=S.wireMouseY;
  let d;
  if(isV){const midy=(from.y+ty)/2;d=`M${from.x},${from.y} C${from.x},${midy} ${tx},${midy} ${tx},${ty}`;}
  else{const midx=(from.x+tx)/2;d=`M${from.x},${from.y} C${midx},${from.y} ${midx},${ty} ${tx},${ty}`;}
  const col=isV?'var(--accent)':'var(--amber)';
  svg.innerHTML='<path d="'+d+'" style="stroke:'+col+'" stroke-width="2" stroke-dasharray="6 4" fill="none"/>'+
    '<circle cx="'+tx+'" cy="'+ty+'" r="4" style="fill:'+col+'"/>';
}
function findCardUnderMouse(mx,my){
  const cx=(mx-S.panX)/S.zoom,cy=(my-S.panY)/S.zoom;
  for(const id of visIds()){const p=S.people[id];const sz=cardSize(id);if(cx>=(p.x||0)-8&&cx<=(p.x||0)+sz.w+8&&cy>=(p.y||0)-8&&cy<=(p.y||0)+sz.h+8)return id;}
  return null;
}

/* ════════════════════════════════════════════════════════════════
   RENDER — connections (string-built SVG, delegated clicks)
   ════════════════════════════════════════════════════════════════ */
let _connsRaf=0;
function scheduleConns(){if(_connsRaf)return;_connsRaf=requestAnimationFrame(()=>{_connsRaf=0;renderConns();});}
function renderConns(){
  const svg=document.getElementById('conn-svg');
  const out=[];const L=[];
  const BEZIER=(S._connStyle==='bezier');
  const r1=n=>Math.round(n*10)/10;
  computeHidden();const G=graph();
  const line=(d,cls)=>L.push('<path class="ln '+cls+'" d="'+d+'"/>');
  const hit=(d,ci)=>L.push('<path class="hit" data-ci="'+ci+'" d="'+d+'"/>');
  const label=(x,y,txt,cls)=>{if(S.showLabels)L.push('<text class="lbl '+cls+'" x="'+r1(x)+'" y="'+r1(y)+'">'+esc(txt)+'</text>');};
  // connection index lookup
    const realKeys=new Set();{const GR=graph(true);for(const id in GR.par)if(GR.par[id].length)realKeys.add(GR.par[id].slice().sort().join('+'));}
  const padreIdx={};VCONNS.forEach(c=>{if(c.type==='padre')padreIdx[c.from+'>'+c.to]=c.ci;});

  /* ── PADRE/MADRE: bus per parent-set ── */
  const parentGroups={};
  for(const kid in G.par){
    if(!G.par[kid].length)continue;
    const key=G.par[kid].slice().sort().join(',');
    (parentGroups[key]=parentGroups[key]||{parents:G.par[kid].slice().sort(),children:[]}).children.push(kid);
  }
  // secondary-couple flag per parent: is any of its couples a secondary couple of the partner?
  const coupleRank=(personId,conn)=>(G.coupConns[personId]||[]).indexOf(conn);
  const kidCi0=k=>{const ps=G.par[k]||[];for(const pid of ps){const i=padreIdx[pid+'>'+k];if(i!==undefined)return i;}return -1;};
  Object.values(parentGroups).forEach(({parents,children})=>{
    const vParents=parents.filter(id=>S.people[id]).sort((a,b)=>(S.people[a].x||0)-(S.people[b].x||0));
    const vChildren=children.filter(id=>S.people[id]).sort((a,b)=>(S.people[a].x||0)-(S.people[b].x||0));
    if(!vParents.length||!vChildren.length)return;
    const hasSecParent=vParents.some(pid=>(G.coupConns[pid]||[]).some(c=>{const other=c.from===pid?c.to:c.from;const cc=G.coupConns[other]||[];return cc.length>1&&coupleRank(other,c)>0;}));
    if(vParents.length>2){
      // each parent couple gets its own short bar; their lines meet above the child
      const used=new Set(),pairs=[];
      vParents.forEach(pid=>{
        if(used.has(pid))return;used.add(pid);
        const mate=(G.coup[pid]||[]).find(q=>vParents.indexOf(q)>=0&&!used.has(q));
        if(mate){used.add(mate);pairs.push([pid,mate]);}else pairs.push([pid]);
      });
      const childPts=vChildren.map(id=>portCanvasPos(id,'t'));
      pairs.forEach(pr=>{
        const pts=pr.map(id=>portCanvasPos(id,'b'));
        const jY=Math.max(...pts.map(p=>p.y))+28;
        pts.forEach(pt=>line(`M${r1(pt.x)},${r1(pt.y)} L${r1(pt.x)},${r1(jY)}`,'ln-padre'));
        const x1=Math.min(...pts.map(p=>p.x)),x2=Math.max(...pts.map(p=>p.x));
        if(pts.length>1)line(`M${r1(x1)},${r1(jY)} L${r1(x2)},${r1(jY)}`,'ln-padre');
        const mx=(x1+x2)/2;
        label(mx,jY-7,t('relPadreMadre'),'lbl-padre');
        // a soft curve straight into the block, so it never reads as part of a sibling bus
        childPts.forEach((cpt,ci)=>{
          const my=(jY+cpt.y)/2;
          const d=`M${r1(mx)},${r1(jY)} C${r1(mx)},${r1(my)} ${r1(cpt.x)},${r1(my)} ${r1(cpt.x)},${r1(cpt.y)}`;
          const k=kidCi0(vChildren[ci]);if(k>=0)hit(d,k);
          line(d,'ln-padre');
        });
      });
      return;
    }
    const parentPts=vParents.map(id=>portCanvasPos(id,'b'));
    const childPts=vChildren.map(id=>portCanvasPos(id,'t'));
    const pxMin=Math.min(...parentPts.map(p=>p.x)),pxMax=Math.max(...parentPts.map(p=>p.x));
    const parentMidX=(pxMin+pxMax)/2;
    const parentBottomY=Math.max(...parentPts.map(p=>p.y));
    const cxMin=Math.min(...childPts.map(p=>p.x)),cxMax=Math.max(...childPts.map(p=>p.x));
    const childTopY=Math.min(...childPts.map(p=>p.y));
    const junctionY=parentBottomY+28;
    parentPts.forEach(pt=>line(`M${r1(pt.x)},${r1(pt.y)} L${r1(pt.x)},${r1(junctionY)}`,'ln-padre'));
    if(parentPts.length>1)line(`M${r1(pxMin)},${r1(junctionY)} L${r1(pxMax)},${r1(junctionY)}`,'ln-padre');
    const kidCi=k=>{for(const pid of vParents){const i=padreIdx[pid+'>'+k];if(i!==undefined)return i;}return -1;};
    if(vChildren.length===1){
      const cpt=childPts[0];const midY=junctionY+(cpt.y-junctionY)*0.5;let d;
      if(BEZIER)d=`M${r1(parentMidX)},${r1(junctionY)} C${r1(parentMidX)},${r1(midY)} ${r1(cpt.x)},${r1(midY)} ${r1(cpt.x)},${r1(cpt.y)}`;
      else if(Math.abs(cpt.x-parentMidX)<3)d=`M${r1(parentMidX)},${r1(junctionY)} L${r1(parentMidX)},${r1(cpt.y)}`;
      else d=`M${r1(parentMidX)},${r1(junctionY)} L${r1(parentMidX)},${r1(midY)} L${r1(cpt.x)},${r1(midY)} L${r1(cpt.x)},${r1(cpt.y)}`;
      const ci=kidCi(vChildren[0]);if(ci>=0)hit(d,ci);
      line(d,'ln-padre'+(hasSecParent?' dash':''));
    } else {
      const childBarY=Math.max(junctionY+14,childTopY-30);
      if(!BEZIER){
        line(`M${r1(parentMidX)},${r1(junctionY)} L${r1(parentMidX)},${r1(childBarY)}`,'ln-padre');
        line(`M${r1(Math.min(cxMin,parentMidX))},${r1(childBarY)} L${r1(Math.max(cxMax,parentMidX))},${r1(childBarY)}`,'ln-padre');
      }
      childPts.forEach((cpt,ci)=>{
        const cr=6;const fromY=childBarY;let d;
        if(BEZIER){const my=(fromY+cpt.y)/2;d=`M${r1(parentMidX)},${r1(junctionY)} C${r1(parentMidX)},${r1(my)} ${r1(cpt.x)},${r1(my)} ${r1(cpt.x)},${r1(cpt.y)}`;}
        else if(Math.abs(cpt.x-parentMidX)<2)d=`M${r1(cpt.x)},${r1(fromY)} L${r1(cpt.x)},${r1(cpt.y)}`;
        else if(cpt.x<parentMidX)d=`M${r1(cpt.x+cr)},${r1(fromY)} Q${r1(cpt.x)},${r1(fromY)} ${r1(cpt.x)},${r1(fromY+cr)} L${r1(cpt.x)},${r1(cpt.y)}`;
        else d=`M${r1(cpt.x-cr)},${r1(fromY)} Q${r1(cpt.x)},${r1(fromY)} ${r1(cpt.x)},${r1(fromY+cr)} L${r1(cpt.x)},${r1(cpt.y)}`;
        const cidx=kidCi(vChildren[ci]);
        if(cidx>=0)hit(BEZIER?d:`M${r1(cpt.x)},${r1(childBarY)} L${r1(cpt.x)},${r1(cpt.y)}`,cidx);
        line(d,'ln-padre'+(hasSecParent?' dash':''));
      });
    }
    label(parentMidX,junctionY-7,t('relPadreMadre'),'lbl-padre');
    if(vChildren.length>=1&&!vChildren.some(k=>REPS[k])&&realKeys.has(parents.join('+'))){
      // "−" chip: collapse these siblings into a "Familia X" card
      const cy=BEZIER?junctionY+16:Math.max(junctionY+14,childTopY-30);
      L.push('<g class="famtog" data-fam="'+parents.join('+')+'"><title>'+esc(t('collapseFam'))+'</title><circle cx="'+r1(parentMidX)+'" cy="'+r1(cy)+'" r="9"/>'+
        '<path d="M'+r1(parentMidX-4)+','+r1(cy)+' H'+r1(parentMidX+4)+'"/></g>');
    }
  });

  // rows index for "is anyone in between?" checks (long links get routed around cards)
  const rowIdx=new Map();
  for(const id of visIds()){const p=S.people[id];const k=Math.round((p.y||0)/8);(rowIdx.get(k)||rowIdx.set(k,[]).get(k)).push(id);}
  const someoneBetween=(a,b)=>{
    const pa=S.people[a],pb=S.people[b];if(Math.abs((pa.y||0)-(pb.y||0))>10)return false;
    const x1=Math.min(pa.x,pb.x),x2=Math.max(pa.x,pb.x),k=Math.round((pa.y||0)/8);
    for(const kk of [k-1,k,k+1]){const L=rowIdx.get(kk);if(!L)continue;for(const id of L){if(id===a||id===b)continue;const x=S.people[id].x;if(x>x1+4&&x<x2-4&&Math.abs(S.people[id].y-pa.y)<40)return true;}}
    return false;
  };
  const detour=(fp,tp,yLvl)=>{const dir=tp.x>fp.x?1:-1;return `M${r1(fp.x)},${r1(fp.y)} H${r1(fp.x+dir*12)} V${r1(yLvl)} H${r1(tp.x-dir*12)} V${r1(tp.y)} H${r1(tp.x)}`;};

  /* ── HERMANO: chain sorted by X ── */
  const _ufP={};
  const _ufF=x=>{if(_ufP[x]===undefined)_ufP[x]=x;return _ufP[x]===x?x:(_ufP[x]=_ufF(_ufP[x]));};
  const hermConns=VCONNS.filter(c=>c.type==='hermano');
  hermConns.forEach(c=>{_ufP[_ufF(c.from)]=_ufF(c.to);});
  const hermGroups={};
  hermConns.forEach(c=>{[c.from,c.to].forEach(id=>{const rt=_ufF(id);(hermGroups[rt]=hermGroups[rt]||new Set()).add(id);});});
  const hermIdx={};VCONNS.forEach(c=>{if(c.type==='hermano'){hermIdx[c.from+'|'+c.to]=c.ci;hermIdx[c.to+'|'+c.from]=c.ci;}});
  Object.values(hermGroups).forEach(set=>{
    const members=[...set].sort((a,b)=>(S.people[a].x||0)-(S.people[b].x||0));
    for(let i=0;i<members.length-1;i++){
      const a=members[i],b=members[i+1];
      const fp=portCanvasPos(a,'r'),tp=portCanvasPos(b,'l');
      let d,ly=Math.min(fp.y,tp.y)-7;
      const around=someoneBetween(a,b);
      if(around){const yb=Math.max(S.people[a].y+cardSize(a).h,S.people[b].y+cardSize(b).h)+14;d=detour(fp,tp,yb);ly=yb-5;}
      else if(Math.abs(fp.y-tp.y)<6)d=`M${r1(fp.x)},${r1(fp.y)} L${r1(tp.x)},${r1(tp.y)}`;
      else{const midX=(fp.x+tp.x)/2;d=`M${r1(fp.x)},${r1(fp.y)} L${r1(midX)},${r1(fp.y)} L${r1(midX)},${r1(tp.y)} L${r1(tp.x)},${r1(tp.y)}`;}
      const ci=hermIdx[a+'|'+b];
      if(ci!==undefined)hit(d,ci);
      line(d,'ln-hermano');
      if(i===0&&(around||Math.abs(tp.x-fp.x)>78))label((fp.x+tp.x)/2,ly,t('relHermano'),'lbl-hermano');
    }
  });

  /* ── PAREJA ── */
  VCONNS.forEach(conn=>{
    const i=conn.ci;
    if(conn.type!=='pareja')return;
    const a=S.people[conn.from],b=S.people[conn.to];if(!a||!b)return;
    const pConns=G.coupConns[conn.from];
    const coupleIdx=pConns.indexOf(conn);
    const isSec=coupleIdx>0;
    if(isSec){const mainNode=pConns[0].from===conn.from?conn.from:conn.to;if(S._secCollapsed&&S._secCollapsed[mainNode])return;}
    const lbl=coupleIdx===0?t('relPareja'):t('relPareja')+' '+(coupleIdx+1);
    const acx=(a.x||0)+cardSize(conn.from).w/2,bcx=(b.x||0)+cardSize(conn.to).w/2;
    const ap=acx<=bcx?'r':'l',bp=acx<=bcx?'l':'r';
    const fp=portCanvasPos(conn.from,ap),tp=portCanvasPos(conn.to,bp);
    const yOff=isSec?16*coupleIdx:0;
    const fy=fp.y+yOff,ty2=tp.y+yOff;
    let d,ly=Math.min(fp.y,tp.y)+(yOff>0?yOff:0)-8;
    if(someoneBetween(conn.from,conn.to)){const yt=Math.min(a.y,b.y)-14-(isSec?8*coupleIdx:0);d=detour(fp,tp,yt);ly=yt-5;}
    else if(yOff===0&&Math.abs(fy-ty2)<3)d=`M${r1(fp.x)},${r1(fy)} L${r1(tp.x)},${r1(ty2)}`;
    else if(yOff>0)d=`M${r1(fp.x)},${r1(fp.y)} L${r1(fp.x)},${r1(fy)} L${r1(tp.x)},${r1(ty2)} L${r1(tp.x)},${r1(tp.y)}`;
    else{const mx=(fp.x+tp.x)/2;d=`M${r1(fp.x)},${r1(fy)} L${r1(mx)},${r1(fy)} L${r1(mx)},${r1(ty2)} L${r1(tp.x)},${r1(ty2)}`;}
    hit(d,i);
    line(d,'ln-pareja'+(isSec?' sec':''));
    label((fp.x+tp.x)/2,ly,lbl,'lbl-pareja');
  });

  if(S.showBoxes)drawFamilyBoxes(out,G);
  svg.innerHTML=out.join('')+L.join('');
}

/* Family bounding boxes (rules unchanged from v2.x):
   box = parent set + their children; married-in partners stay out until they have kids;
   sibling links never merge boxes; pure sibling clusters get their own box. */
function drawFamilyBoxes(out,G){
  const ids=visIds();if(!ids.length)return;
  const pad=16;
  const palette=['#f25f55','#5b97ff','#3ecf6a','#f2ab43','#a78bfa','#fb923c','#2dd4bf','#f472b6'];
  let ci=0;const boxed={};
  function drawBox(members){
    const uniq=[...new Set(members)].filter(id=>S.people[id]);
    if(uniq.length<2)return;
    let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    uniq.forEach(id=>{const p=S.people[id],sz=cardSize(id);x1=Math.min(x1,p.x||0);y1=Math.min(y1,p.y||0);x2=Math.max(x2,(p.x||0)+sz.w);y2=Math.max(y2,(p.y||0)+sz.h);});
    x1-=pad;y1-=pad;x2+=pad;y2+=pad;
    const color=palette[ci++%palette.length];
    out.push('<rect class="fbox" x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" rx="14" fill="'+color+'" fill-opacity="0.03" stroke="'+color+'" stroke-opacity="0.38"/>');
  }
  const groups={};
  ids.forEach(kid=>{if(!G.par[kid].length)return;const pars=G.par[kid].slice().sort();const key=pars.join('+');(groups[key]=groups[key]||{parents:pars,kids:[]}).kids.push(kid);});
  Object.values(groups).forEach(g=>{const m=g.parents.concat(g.kids);drawBox(m);m.forEach(id=>{boxed[id]=true;});});
  const doneCouple={};
  VCONNS.forEach(c=>{
    if(c.type!=='pareja')return;
    const a=c.from,b=c.to,k=[a,b].sort().join('|');
    if(doneCouple[k])return;doneCouple[k]=true;
    if(boxed[a]||boxed[b])return;
    const shared=(G.ch[a]||[]).some(kk=>(G.ch[b]||[]).indexOf(kk)>=0);
    if(shared)return;
    drawBox([a,b]);boxed[a]=true;boxed[b]=true;
  });
  const hseen={};
  ids.forEach(id=>{
    if(hseen[id]||boxed[id])return;
    const comp=[],q=[id];hseen[id]=true;
    while(q.length){const cur=q.shift();if(boxed[cur])continue;comp.push(cur);(G.sib[cur]||[]).forEach(n=>{if(!hseen[n]){hseen[n]=true;q.push(n);}});}
    if(comp.length>=2){drawBox(comp);comp.forEach(m=>{boxed[m]=true;});}
  });
}
